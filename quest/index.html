<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1730" />
    <!-- PWA -->
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="柔整国試" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>if("serviceWorker"in navigator){addEventListener("load",function(){navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){})})}</script>
    <!-- /PWA -->
    <meta name="description" content="10問ミニクエストと、まちがえた問題だけの復習。約3分で1セット（無料）。" />
    <title>10問ミニクエスト｜柔整国試ポータル</title>
    <link rel="stylesheet" href="../game/game.css" />
  </head>
  <body class="jkq-body">
    <a class="jkq-return" href="../">← ポータルへ</a>
    <main class="jkq-shell">
      <header class="jkq-head">
        <div class="jkq-mark" aria-hidden="true">10</div>
        <div><p class="jkq-eyebrow">約3分・無料</p><h1>10問ミニクエスト</h1></div>
      </header>

      <section id="v-setup" class="jkq-surface" aria-labelledby="setup-h">
        <h2 id="setup-h">どの科目にする？</h2>
        <div class="jkq-seg" role="group" aria-label="科目">
          <button type="button" data-subj="ana" aria-pressed="false">解剖学</button>
          <button type="button" data-subj="phy" aria-pressed="true">生理学</button>
          <button type="button" data-subj="cli" aria-pressed="false">一般臨床</button>
        </div>
        <h3 class="jkq-h3">問題のタイプ</h3>
        <div class="jkq-seg" role="group" aria-label="問題のタイプ">
          <button type="button" data-type="qa" aria-pressed="true">一問一答（やさしめ）</button>
          <button type="button" data-type="past" aria-pressed="false">過去問（4択）</button>
        </div>
        <p class="jkq-note" id="type-note"></p>
        <label class="jkq-field" id="topic-wrap"><span>分野</span>
          <select id="topic-select"><option value="all">ぜんぶ</option></select>
        </label>
        <button type="button" class="jkq-primary" id="start-btn">10問スタート →</button>
        <button type="button" class="jkq-secondary is-weak" id="weak-btn" hidden>まちがえた問題だけ復習（<span id="weak-btn-n">0</span>問）</button>
        <p class="jkq-note" id="no-weak">まちがえた問題は、ここに自動でたまります。</p>
        <p class="jkq-note">記録は、この端末の中だけに保存されます。</p>
      </section>

      <section id="v-loading" class="jkq-surface" hidden><p>問題を読み込んでいます…</p></section>

      <section id="v-quiz" class="jkq-surface" hidden aria-labelledby="q-text">
        <div class="jkq-top">
          <button type="button" class="jkq-quit" id="quit">やめる</button>
          <div class="jkq-prog"><strong id="prog-n">1</strong> / <span id="prog-t">10</span></div>
          <div class="jkq-label" id="q-label"></div>
        </div>
        <div class="jkq-track" aria-hidden="true"><i id="prog-bar"></i></div>
        <p class="jkq-multi" id="multi-note" hidden>正しいものをすべて選ぶ</p>
        <h2 id="q-text" class="jkq-q"></h2>
        <img id="q-img" class="jkq-img" alt="問題の図・写真" hidden />
        <div id="choices" class="jkq-choices"></div>
        <button type="button" class="jkq-primary" id="submit" disabled hidden>こたえる</button>
        <button type="button" class="jkq-primary" id="show-ans" hidden>答えを見る</button>
        <div id="fb" class="jkq-fb" hidden aria-live="polite">
          <strong id="fb-title"></strong>
          <p id="fb-ans"></p>
          <div id="fb-why-wrap"><b>なぜ</b><p id="fb-why"></p></div>
          <div id="fb-btns" class="jkq-two" hidden>
            <button type="button" class="jkq-primary" id="know">わかってた</button>
            <button type="button" class="jkq-secondary" id="unsure">まだあやしい</button>
          </div>
          <button type="button" class="jkq-primary" id="next">次の問題へ</button>
        </div>
      </section>

      <section id="v-result" class="jkq-surface jkq-result" hidden aria-labelledby="r-h">
        <p class="jkq-eyebrow">RESULT</p>
        <h2 id="r-h">おつかれさま！</h2>
        <div class="jkq-ring" id="r-ring"><div><strong id="r-pct">0%</strong></div></div>
        <p class="jkq-score"><strong id="r-score"></strong> 正解</p>
        <p class="jkq-msg" id="r-msg"></p>
        <div class="jkq-gain">
          <div><small>もらったXP</small><b id="r-xp"></b></div>
          <div><small>連続日数</small><b id="r-streak"></b></div>
          <div class="jkq-gain-lv"><small>レベル</small><b id="r-lv"></b><span class="jkg-bar"><i id="r-bar"></i></span></div>
        </div>
        <p class="jkq-note" id="r-weaknote"></p>
        <button type="button" class="jkq-primary" id="r-again">もう一回</button>
        <button type="button" class="jkq-secondary is-weak" id="r-wrong" hidden></button>
        <button type="button" class="jkq-secondary" id="r-back">科目・設定にもどる</button>
        <button type="button" class="jkg-link" data-jkg-open>🏅 バッジ・きろくを見る</button>
        <p class="jkq-note">記録は、この端末の中だけに保存されます。</p>
      </section>

      <section id="v-error" class="jkq-surface" hidden>
        <h2>読み込めませんでした</h2>
        <p>ネットワークを確認して、もう一度ためしてください。</p>
        <button type="button" class="jkq-primary" id="retry-error">もどる</button>
      </section>
    </main>
    <script src="../game/game.js"></script>
    <script src="./quest.js"></script>
  </body>
</html>
