<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" width="560" height="372" role="img" aria-label="赤血球ができる流れ（材料・骨髄・エリスロポエチン・寿命）の図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>赤血球ができる流れ（材料・骨髄・エリスロポエチン・寿命）の図</title><rect width="560" height="372" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="14" width="536" height="68" rx="12" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><rect x="12" y="14" width="92" height="68" rx="12" fill="#b77a00" stroke="#b77a00" stroke-width="2" /><text x="58" y="55" font-size="21" fill="#fff" font-weight="bold" text-anchor="middle" >材料</text><text x="118" y="54" font-size="15" fill="#142638" font-weight="bold" text-anchor="start" >鉄（ヘモグロビンの材料）／ビタミンB12・葉酸（核の材料）</text><line x1="58" y1="84" x2="58" y2="104" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="106" width="536" height="68" rx="12" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><rect x="12" y="106" width="92" height="68" rx="12" fill="#0b5ea8" stroke="#0b5ea8" stroke-width="2" /><text x="58" y="147" font-size="21" fill="#fff" font-weight="bold" text-anchor="middle" >骨髄</text><text x="118" y="146" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >造血幹細胞から赤血球ができる</text><line x1="58" y1="176" x2="58" y2="196" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="198" width="536" height="68" rx="12" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><rect x="12" y="198" width="92" height="68" rx="12" fill="#2e8b57" stroke="#2e8b57" stroke-width="2" /><text x="58" y="239" font-size="21" fill="#fff" font-weight="bold" text-anchor="middle" >腎臓</text><text x="118" y="238" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >エリスロポエチンが骨髄に「増やせ」と命令</text><line x1="58" y1="268" x2="58" y2="288" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="290" width="536" height="68" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><rect x="12" y="290" width="92" height="68" rx="12" fill="#cf2634" stroke="#cf2634" stroke-width="2" /><text x="58" y="331" font-size="21" fill="#fff" font-weight="bold" text-anchor="middle" >赤血球</text><text x="118" y="330" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >核なし。寿命は約120日。脾臓などで処理</text></svg>