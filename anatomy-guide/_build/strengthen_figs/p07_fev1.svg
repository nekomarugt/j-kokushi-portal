<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="1秒率の考え方と、健常と閉塞性換気障害の呼出曲線の比較図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>1秒率の考え方と、健常と閉塞性換気障害の呼出曲線の比較図</title><rect width="560" height="400" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><line x1="70" y1="318" x2="520" y2="318" stroke="#607487" stroke-width="2.5"/><line x1="70" y1="318" x2="70" y2="40" stroke="#607487" stroke-width="2.5"/><text x="520" y="346" font-size="15" fill="#607487" font-weight="normal" text-anchor="end" >時間（秒）</text><text x="62" y="32" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >吐いた量</text><line x1="182" y1="318" x2="182" y2="60" stroke="#b77a00" stroke-width="2" stroke-dasharray="6 4"/><text x="182" y="342" font-size="15" fill="#b77a00" font-weight="bold" text-anchor="middle" >1秒</text><path d="M70,318 C110,128 150,68 210,56 L500,52" fill="none" stroke="#0b5ea8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M70,318 C130,228 230,148 330,86 L500,68" fill="none" stroke="#cf2634" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="500" y="42" font-size="16" fill="#0b5ea8" font-weight="bold" text-anchor="end" >健常</text><text x="500" y="86" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="end" >閉塞性（COPDなど）</text><text x="500" y="258" font-size="15" fill="#142638" font-weight="normal" text-anchor="end" >いちばん上＝努力肺活量</text><rect x="12" y="356" width="536" height="34" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="379" font-size="16" fill="#142638" font-weight="bold" text-anchor="start" >1秒率＝1秒でどれだけ吐けたか ÷ 努力肺活量 × 100</text></svg>