<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 316" width="560" height="316" role="img" aria-label="排卵後の黄体、妊娠でのhCG、授乳のホルモンの流れの図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>排卵後の黄体、妊娠でのhCG、授乳のホルモンの流れの図</title><rect width="560" height="316" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="14" width="130" height="54" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="77.0" y="47.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >排卵</text><line x1="144" y1="41" x2="176" y2="41" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="178" y="14" width="150" height="54" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="253.0" y="38.0" font-size="19" fill="#b77a00" font-weight="bold" text-anchor="middle" >黄体</text><text x="253.0" y="58.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >プロジェステロン</text><line x1="330" y1="30" x2="372" y2="30" stroke="#2e8b57" stroke-width="3" marker-end="url(#ahg)"/><line x1="330" y1="52" x2="372" y2="52" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="374" y="8" width="174" height="40" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="461.0" y="33.76" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >妊娠した → hCG</text><rect x="374" y="54" width="174" height="40" rx="10" fill="#f3f8fc" stroke="#9aa9b8" stroke-width="2"/><text x="461.0" y="79.4" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="middle" >妊娠なし → 白体・月経</text><line x1="461" y1="98" x2="461" y2="128" stroke="#2e8b57" stroke-width="3" marker-end="url(#ahg)"/><rect x="12" y="130" width="536" height="54" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="280.0" y="163.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >hCGが黄体を延命 → 少しあとで胎盤がホルモンを出す</text><rect x="12" y="204" width="536" height="96" rx="12" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="234" font-size="18" fill="#b77a00" font-weight="bold" text-anchor="start" >授乳のホルモン</text><text x="28" y="264" font-size="18" fill="#142638" font-weight="bold" text-anchor="start" >プロラクチン ＝ 乳汁をつくる</text><text x="28" y="290" font-size="18" fill="#142638" font-weight="bold" text-anchor="start" >オキシトシン ＝ 乳汁を出す（射出）</text></svg>