<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 337" width="560" height="337" role="img" aria-label="甲状腺ホルモン・カルシトニン・上皮小体ホルモンの作用と過不足の症状の表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>甲状腺ホルモン・カルシトニン・上皮小体ホルモンの作用と過不足の症状の表</title><rect width="560" height="337" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="76.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >ホルモン</text><text x="245.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >主な作用</text><text x="449.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >多い／少ない</text><rect x="12" y="58" width="536" height="69" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="97.62" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >甲状腺ホルモン</text><text x="245.0" y="85.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >代謝と熱産生を高める</text><text x="245.0" y="109.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >（材料はヨウ素）</text><text x="449.0" y="86.3" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >多い：やせる・脈が速い</text><text x="449.0" y="108.3" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >少ない：寒がり・脈が遅い</text><rect x="12" y="133" width="536" height="71" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="174.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >カルシトニン</text><text x="245.0" y="161.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >骨吸収を抑える</text><text x="245.0" y="185.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >（血中Caを下げる方）</text><text x="449.0" y="173.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >―</text><rect x="12" y="210" width="536" height="69" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="238.48" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="middle" >上皮小体ホルモン</text><text x="76.0" y="259.48" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="middle" >（PTH）</text><text x="245.0" y="249.94" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >血中Caを上げる</text><text x="449.0" y="237.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >少ない：血中Caが低く</text><text x="449.0" y="261.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >テタニー（けいれん）</text><rect x="12" y="287" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="312" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >血中Caを上げるのはPTH。カルシトニンは骨吸収を抑える</text></svg>