<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 343" width="560" height="343" role="img" aria-label="糖質・タンパク質・脂質の1gあたりのエネルギーと、ビタミンの分類の表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>糖質・タンパク質・脂質の1gあたりのエネルギーと、ビタミンの分類の表</title><rect width="560" height="343" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="76.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >栄養素</text><text x="235.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >1gあたり</text><text x="439.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >ひとこと</text><rect x="12" y="58" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="86.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >糖質</text><text x="235.0" y="86.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >約4kcal</text><text x="439.0" y="86.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >すぐ使うエネルギー源</text><rect x="12" y="110" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="138.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >タンパク質</text><text x="235.0" y="138.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >約4kcal</text><text x="439.0" y="138.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >体の材料にもなる</text><rect x="12" y="162" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="190.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >脂質</text><text x="235.0" y="190.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >約9kcal</text><text x="439.0" y="190.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >エネルギーが多い</text><rect x="12" y="214" width="536" height="71" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="255.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >ビタミン</text><text x="235.0" y="254.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >エネルギーにならない</text><text x="439.0" y="242.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >脂溶性＝A・D・E・K</text><text x="439.0" y="266.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >水溶性＝B群・C</text><rect x="12" y="293" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="318" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >B1が足りないと脚気</text></svg>