<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="医療面接の開放型質問と閉鎖型質問の比較図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>医療面接の開放型質問と閉鎖型質問の比較図</title><rect width="560" height="330" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="262" height="250" rx="12" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="143" y="46" font-size="21" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >開放型の質問</text><line x1="26" y1="60" x2="260" y2="60" stroke="#0b5ea8" stroke-width="1.5"/><text x="143" y="96" font-size="15" fill="#142638" font-weight="bold" text-anchor="middle" >自由に答えられる</text><text x="143" y="136" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >「どうなさいましたか？」</text><text x="143" y="176" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >「どのようなことで来ましたか？」</text><rect x="89.0" y="223" width="108.0" height="26" rx="13" fill="#0b5ea8"/><text x="143" y="241.4" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" >はじめに使う</text><rect x="286" y="12" width="262" height="250" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="417" y="46" font-size="21" fill="#cf2634" font-weight="bold" text-anchor="middle" >閉鎖型の質問</text><line x1="300" y1="60" x2="534" y2="60" stroke="#cf2634" stroke-width="1.5"/><text x="417" y="96" font-size="15" fill="#142638" font-weight="bold" text-anchor="middle" >「はい／いいえ」で答える</text><text x="417" y="136" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >「頭は痛みますか？」</text><text x="417" y="176" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >「熱はありますか？」</text><rect x="340.5" y="223" width="153.0" height="26" rx="13" fill="#cf2634"/><text x="417" y="241.4" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" >話を絞るときに使う</text><rect x="12" y="276" width="536" height="40" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="302" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >まず開放型 → あとで閉鎖型で確かめる</text></svg>