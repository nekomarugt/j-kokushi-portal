<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="上位運動ニューロン障害と下位運動ニューロン障害の比較表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>上位運動ニューロン障害と下位運動ニューロン障害の比較表</title><rect width="560" height="420" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="64" rx="12" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><rect x="24" y="22" width="120" height="44" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="84.0" y="50.12" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="middle" >大脳皮質</text><line x1="146" y1="44" x2="196" y2="44" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)"/><rect x="198" y="22" width="140" height="44" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="268.0" y="50.12" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="middle" >脊髄の前角</text><line x1="340" y1="44" x2="390" y2="44" stroke="#2e8b57" stroke-width="3" marker-end="url(#ahg)"/><rect x="392" y="22" width="60" height="44" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="422.0" y="50.12" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="middle" >筋</text><rect x="112.0" y="77" width="116.0" height="26" rx="13" fill="#0b5ea8"/><text x="170" y="95.04" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" >上位ニューロン</text><rect x="297.0" y="77" width="46.0" height="26" rx="13" fill="#2e8b57"/><text x="320" y="95.04" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" >下位</text><rect x="12" y="112" width="536" height="292" rx="12" fill="#fff" stroke="#d8e4ee" stroke-width="2" /><line x1="24" y1="150" x2="536" y2="150" stroke="#d8e4ee" stroke-width="1.5"/><text x="28" y="182" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >麻痺のかたち</text><text x="330" y="182" font-size="17" fill="#142638" font-weight="bold" text-anchor="middle" >痙性（つっぱる）</text><text x="468" y="182" font-size="17" fill="#142638" font-weight="bold" text-anchor="middle" >弛緩性（だらん）</text><line x1="24" y1="208" x2="536" y2="208" stroke="#d8e4ee" stroke-width="1.5"/><text x="28" y="240" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >腱反射</text><text x="330" y="240" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >亢進</text><text x="468" y="240" font-size="17" fill="#142638" font-weight="bold" text-anchor="middle" >低下・消失</text><line x1="24" y1="266" x2="536" y2="266" stroke="#d8e4ee" stroke-width="1.5"/><text x="28" y="298" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >バビンスキー反射</text><text x="330" y="298" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >出る</text><text x="468" y="298" font-size="17" fill="#142638" font-weight="bold" text-anchor="middle" >出ない</text><line x1="24" y1="324" x2="536" y2="324" stroke="#d8e4ee" stroke-width="1.5"/><text x="28" y="356" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >筋萎縮</text><text x="330" y="356" font-size="17" fill="#142638" font-weight="bold" text-anchor="middle" >目立たない</text><text x="468" y="356" font-size="17" fill="#142638" font-weight="bold" text-anchor="middle" >著しい</text>