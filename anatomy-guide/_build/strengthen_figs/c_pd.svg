<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 342" width="560" height="342" role="img" aria-label="パーキンソン病の原因と4つの主な症状の図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>パーキンソン病の原因と4つの主な症状の図</title><rect width="560" height="342" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="250" height="50" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="137.0" y="43.12" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="middle" >黒質のドパミン神経が減る</text><line x1="264" y1="37" x2="296" y2="37" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="298" y="12" width="250" height="50" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="423.0" y="43.12" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="middle" >線条体のドパミンが不足</text><rect x="12" y="82" width="262" height="88" rx="12" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="143" y="118" font-size="21" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >振戦</text><text x="143" y="148" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >安静時にふるえる</text><rect x="286" y="82" width="262" height="88" rx="12" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="417" y="118" font-size="21" fill="#2e8b57" font-weight="bold" text-anchor="middle" >筋固縮</text><text x="417" y="148" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >筋がかたくこわばる</text><rect x="12" y="182" width="262" height="88" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="143" y="218" font-size="21" fill="#cf2634" font-weight="bold" text-anchor="middle" >無動（寡動）</text><text x="143" y="248" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >動きが少なく遅い</text><rect x="286" y="182" width="262" height="88" rx="12" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="417" y="218" font-size="21" fill="#8a5a00" font-weight="bold" text-anchor="middle" >姿勢反射障害</text><text x="417" y="248" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >倒れそうでも立て直せない</text><rect x="12" y="286" width="536" height="44" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2" stroke-dasharray="6 4"/><text x="28" y="314" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="start" >治療はレボドパ（ドパミンの材料）が中心</text></svg>