<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430" role="img" aria-label="ビタミンDが皮膚・肝臓・腎臓を経て活性型になり小腸でCa吸収を高める図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>ビタミンDが皮膚・肝臓・腎臓を経て活性型になり小腸でCa吸収を高める図</title><rect width="560" height="430" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="14" width="536" height="74" rx="12" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><rect x="12" y="14" width="92" height="74" rx="12" fill="#0b5ea8" stroke="#0b5ea8" stroke-width="2" /><text x="58" y="60" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" >皮膚</text><text x="118" y="58" font-size="18" fill="#142638" font-weight="bold" text-anchor="start" >紫外線でビタミンDができる（食べ物からも）</text><line x1="58" y1="90" x2="58" y2="112" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="114" width="536" height="74" rx="12" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><rect x="12" y="114" width="92" height="74" rx="12" fill="#2e8b57" stroke="#2e8b57" stroke-width="2" /><text x="58" y="160" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" >肝臓</text><text x="118" y="158" font-size="18" fill="#142638" font-weight="bold" text-anchor="start" >形を変える（1回目）</text><line x1="58" y1="190" x2="58" y2="212" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="214" width="536" height="74" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><rect x="12" y="214" width="92" height="74" rx="12" fill="#cf2634" stroke="#cf2634" stroke-width="2" /><text x="58" y="260" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" >腎臓</text><text x="118" y="258" font-size="18" fill="#142638" font-weight="bold" text-anchor="start" >PTHの働きで活性型になる（2回目）</text><line x1="58" y1="290" x2="58" y2="312" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="314" width="536" height="74" rx="12" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><rect x="12" y="314" width="92" height="74" rx="12" fill="#b77a00" stroke="#b77a00" stroke-width="2" /><text x="58" y="360" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" >小腸</text><text x="118" y="358" font-size="18" fill="#142638" font-weight="bold" text-anchor="start" >活性型ビタミンDがCaの吸収を高める</text></svg>