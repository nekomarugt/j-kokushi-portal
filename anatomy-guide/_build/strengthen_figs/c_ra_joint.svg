<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 393" width="560" height="393" role="img" aria-label="関節リウマチと変形性関節症の比較表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>関節リウマチと変形性関節症の比較表</title><rect width="560" height="393" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="234.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >関節リウマチ</text><text x="443.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >変形性関節症</text><rect x="12" y="58" width="536" height="71" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="99.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >好発</text><text x="234.0" y="86.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >手指のMCP・PIP・手首</text><text x="234.0" y="110.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >足趾のMTP（左右対称）</text><text x="443.0" y="98.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >指先のDIP・膝・股</text><rect x="12" y="135" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="163.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >こわばり</text><text x="234.0" y="163.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >朝のこわばり</text><text x="443.0" y="163.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >動き始めだけ</text><rect x="12" y="187" width="536" height="71" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="228.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >全身</text><text x="234.0" y="215.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >関節の外にも症状</text><text x="234.0" y="239.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >（肺・血管・目など）</text><text x="443.0" y="227.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >関節だけ</text><rect x="12" y="264" width="536" height="71" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="305.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >検査</text><text x="234.0" y="292.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >リウマトイド因子</text><text x="234.0" y="316.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >抗CCP抗体</text><text x="443.0" y="292.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >リウマトイド因子は</text><text x="443.0" y="316.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >陰性</text><rect x="12" y="343" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="368" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >関節リウマチは、全身の炎症の病気</text></svg>