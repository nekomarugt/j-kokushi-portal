<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 343" width="560" height="343" role="img" aria-label="男性と女性の性分化（精巣・卵巣と、ウォルフ管・ミュラー管の運命）の比較表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>男性と女性の性分化（精巣・卵巣と、ウォルフ管・ミュラー管の運命）の比較表</title><rect width="560" height="343" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="236.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >男性（XY）</text><text x="444.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >女性（XX）</text><rect x="12" y="58" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="72.0" y="86.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >生殖腺</text><text x="236.0" y="86.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >精巣</text><text x="444.0" y="86.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >卵巣</text><rect x="12" y="110" width="536" height="71" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="72.0" y="151.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >ホルモン</text><text x="236.0" y="138.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >テストステロン</text><text x="236.0" y="162.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >抗ミュラー管ホルモン</text><text x="444.0" y="138.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >精巣がないので</text><text x="444.0" y="162.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >その指令がない</text><rect x="12" y="187" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="72.0" y="215.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >ウォルフ管</text><text x="236.0" y="215.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >育つ（精巣上体・精管）</text><text x="444.0" y="215.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >退縮する</text><rect x="12" y="239" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="72.0" y="267.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >ミュラー管</text><text x="236.0" y="267.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >退縮する</text><text x="444.0" y="267.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >育つ（卵管・子宮）</text><rect x="12" y="293" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="318" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >ミュラー管は、ホルモンの指令が無いと残る方</text></svg>