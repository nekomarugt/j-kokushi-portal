<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="イヌリン・クレアチニン・グルコース・アルブミンのろ過後のゆくえの比較図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>イヌリン・クレアチニン・グルコース・アルブミンのろ過後のゆくえの比較図</title><rect width="560" height="380" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="28" y="34" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >物質</text><text x="200" y="34" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >ろ過後のゆくえ</text><text x="430" y="34" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >ひとこと</text><rect x="12" y="50" width="536" height="68" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2" /><rect x="12" y="50" width="6" height="68" rx="0" fill="#0b5ea8" stroke="#0b5ea8" stroke-width="0" /><text x="28" y="90" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="start" >イヌリン</text><text x="200" y="90" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >戻らない・足されない</text><text x="398" y="90" font-size="15" fill="#142638" font-weight="bold" text-anchor="start" >GFRをはかる物差し</text><rect x="12" y="130" width="536" height="68" rx="10" fill="#fff" stroke="#2e8b57" stroke-width="2" /><rect x="12" y="130" width="6" height="68" rx="0" fill="#2e8b57" stroke="#2e8b57" stroke-width="0" /><text x="28" y="170" font-size="18" fill="#2e8b57" font-weight="bold" text-anchor="start" >クレアチニン</text><text x="200" y="170" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >ほぼイヌリンと同じ</text><text x="398" y="170" font-size="15" fill="#142638" font-weight="bold" text-anchor="start" >ふだんのGFRの目安</text><rect x="12" y="210" width="536" height="68" rx="10" fill="#fff" stroke="#b77a00" stroke-width="2" /><rect x="12" y="210" width="6" height="68" rx="0" fill="#b77a00" stroke="#b77a00" stroke-width="0" /><text x="28" y="250" font-size="18" fill="#8a5a00" font-weight="bold" text-anchor="start" >グルコース</text><text x="200" y="250" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >全部戻る</text><text x="398" y="250" font-size="15" fill="#142638" font-weight="bold" text-anchor="start" >正常では尿に出ない</text><rect x="12" y="290" width="536" height="68" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2" /><rect x="12" y="290" width="6" height="68" rx="0" fill="#cf2634" stroke="#cf2634" stroke-width="0" /><text x="28" y="330" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >アルブミン</text><text x="200" y="330" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >ほとんどろ過されない</text><text x="398" y="330" font-size="15" fill="#142638" font-weight="bold" text-anchor="start" >尿に出たら異常</text></svg>