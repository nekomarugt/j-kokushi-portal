<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" width="560" height="350" role="img" aria-label="一次痛(Aδ線維)と二次痛(C線維)の比較図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>一次痛(Aδ線維)と二次痛(C線維)の比較図</title><rect width="560" height="350" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="262" height="258" rx="12" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="143" y="46" font-size="23" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >一次痛</text><text x="143" y="76" font-size="19" fill="#142638" font-weight="bold" text-anchor="middle" >Aδ線維</text><line x1="26" y1="90" x2="260" y2="90" stroke="#0b5ea8" stroke-width="1.5"/><text x="143" y="124" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >速い</text><text x="143" y="160" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >鋭い</text><text x="143" y="196" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >場所がはっきり</text><text x="143" y="232" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >有髄</text><rect x="286" y="12" width="262" height="258" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="417" y="46" font-size="23" fill="#cf2634" font-weight="bold" text-anchor="middle" >二次痛</text><text x="417" y="76" font-size="19" fill="#142638" font-weight="bold" text-anchor="middle" >C線維</text><line x1="300" y1="90" x2="534" y2="90" stroke="#cf2634" stroke-width="1.5"/><text x="417" y="124" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >遅い</text><text x="417" y="160" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >鈍い</text><text x="417" y="196" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >場所がはっきりしない</text><text x="417" y="232" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >無髄・ポリモーダル</text><rect x="12" y="282" width="536" height="56" rx="12" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="306" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >痛み・温度は自由神経終末で感じる。</text><text x="28" y="328" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >温覚と冷覚は、別々の受容器。</text></svg>