<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 317" width="560" height="317" role="img" aria-label="腎臓の皮質・髄質・乳頭と腎門に何があるかの表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>腎臓の皮質・髄質・乳頭と腎門に何があるかの表</title><rect width="560" height="317" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="76.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >場所</text><text x="344.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >あるもの</text><rect x="12" y="58" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="86.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >皮質（外側）</text><text x="344.0" y="86.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >腎小体（糸球体）・曲尿細管・腎柱</text><rect x="12" y="110" width="536" height="45" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="137.62" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >髄質（腎錐体）</text><text x="344.0" y="137.94" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >ヘンレのワナ・集合管</text><rect x="12" y="161" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="189.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >腎乳頭</text><text x="344.0" y="189.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >乳頭孔から尿が腎杯へ出る</text><rect x="12" y="213" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="241.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >腎門</text><text x="344.0" y="241.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >腎動脈・腎静脈・尿管（腎盂）・神経・リンパ管</text><rect x="12" y="267" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="292" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >ろ過は外側の皮質、濃くするのは内側の髄質</text></svg>