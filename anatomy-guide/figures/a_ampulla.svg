<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348" width="560" height="348" role="img" aria-label="胆汁と膵液が大十二指腸乳頭から十二指腸へ出る経路の図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>胆汁と膵液が大十二指腸乳頭から十二指腸へ出る経路の図</title><rect width="560" height="348" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="14" width="110" height="44" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="67.0" y="42.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >肝臓</text><line x1="124" y1="36" x2="168" y2="36" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="170" y="14" width="120" height="44" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="230.0" y="42.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >総肝管</text><line x1="292" y1="36" x2="350" y2="70" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="74" width="110" height="44" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="67.0" y="102.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >胆嚢</text><line x1="124" y1="96" x2="168" y2="96" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="170" y="74" width="120" height="44" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="230.0" y="102.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >胆嚢管</text><line x1="292" y1="96" x2="350" y2="82" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="352" y="56" width="196" height="50" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="450.0" y="87.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >総胆管</text><rect x="12" y="134" width="110" height="44" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2"/><text x="67.0" y="162.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >膵臓</text><line x1="124" y1="156" x2="168" y2="156" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="170" y="134" width="120" height="44" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2"/><text x="230.0" y="162.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >主膵管</text><line x1="450" y1="108" x2="450" y2="190" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><line x1="292" y1="156" x2="350" y2="206" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)"/><rect x="300" y="194" width="248" height="62" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="424.0" y="222.0" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >大十二指腸乳頭</text><text x="424.0" y="242.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >下行部・オッディ括約筋</text><rect x="12" y="272" width="536" height="64" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="300" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >出口に胆石がつまると、黄疸になることがある。</text><text x="28" y="326" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >膵液も出にくくなり、膵炎になることもある。</text></svg>