<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 314" width="560" height="314" role="img" aria-label="舌咽神経と迷走神経が受け持つものの比較表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>舌咽神経と迷走神経が受け持つものの比較表</title><rect width="560" height="314" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="242.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >舌咽神経（Ⅸ）</text><text x="446.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >迷走神経（Ⅹ）</text><rect x="12" y="58" width="536" height="71" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="99.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >感覚</text><text x="242.0" y="86.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >頸動脈洞・頸動脈小体</text><text x="242.0" y="110.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >舌の後ろ1/3の味覚</text><text x="446.0" y="98.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >大動脈の圧・化学受容器</text><rect x="12" y="135" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="163.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >分泌・運動</text><text x="242.0" y="163.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >耳下腺の分泌</text><text x="446.0" y="163.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >喉頭の運動（反回神経）</text><rect x="12" y="187" width="536" height="69" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="76.0" y="226.62" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >反回するところ</text><text x="242.0" y="226.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" ></text><text x="446.0" y="214.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >右＝右鎖骨下動脈</text><text x="446.0" y="238.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >左＝大動脈弓</text><rect x="12" y="264" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="289" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >顔面神経は耳下腺を貫くだけ。分泌は舌咽神経</text></svg>