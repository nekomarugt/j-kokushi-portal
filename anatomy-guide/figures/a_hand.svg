<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 318" width="560" height="318" role="img" aria-label="橈骨神経・尺骨神経・正中神経・腋窩神経の傷つく場所と麻痺の例の表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>橈骨神経・尺骨神経・正中神経・腋窩神経の傷つく場所と麻痺の例の表</title><rect width="560" height="318" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="68.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >神経</text><text x="231.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >傷つきやすい場所</text><text x="443.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >麻痺のしるし</text><rect x="12" y="58" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="68.0" y="86.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >橈骨神経</text><text x="231.0" y="86.12" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >上腕骨の体（橈骨神経溝）</text><text x="443.0" y="85.8" font-size="15" fill="#cf2634" font-weight="bold" text-anchor="middle" >下垂手（手首が上がらない）</text><rect x="12" y="110" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="68.0" y="138.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >尺骨神経</text><text x="231.0" y="138.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >上腕骨の内側上顆の後ろ</text><text x="443.0" y="138.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >鷲手（かぎ爪の形の手）</text><rect x="12" y="162" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="68.0" y="190.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >正中神経</text><text x="231.0" y="189.8" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >上腕動脈といっしょに肘窩へ</text><text x="443.0" y="190.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >猿手（母指球がやせる）</text><rect x="12" y="214" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="68.0" y="242.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >腋窩神経</text><text x="231.0" y="242.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >上腕骨の外科頸の後ろ</text><text x="443.0" y="242.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >三角筋が働かない</text><rect x="12" y="268" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="293" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >骨に近い所で骨折すると、神経も傷つく</text></svg>