<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="この端末に保存された学習記録から、教科・分野ごとの正解率や弱い分野を表示します（端末内だけ・無料）。" />
    <title>じぶんのパラメータ｜柔整国試ポータル</title>
    <link rel="stylesheet" href="../game/game.css" />
    <style>:root{--ink:#10223e;--muted:#63728a;--line:#d9e1ec;--paper:#ffffff;--navy:#173d78;--blue:#1676ae;--teal:#087866;--tint:#eaf8f4}
.st{max-width:640px;margin:0 auto;padding:16px 16px 96px;color:var(--ink);line-height:1.55}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(12,35,72,.06)}
.card h2{font-size:1rem;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}
.st-bigs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st-big{background:var(--tint);border-radius:12px;padding:12px;text-align:center}.st-num{font-size:28px;font-weight:800;color:var(--navy);line-height:1.2}.st-lab{font-size:12px;color:var(--muted)}
.st-bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 4.2em;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
a.st-bar:hover .st-bl{text-decoration:underline}.st-bl{font-size:13px;overflow-wrap:anywhere}.st-bl small,.st-v small{display:block;color:var(--muted);font-size:11px}
.st-track{height:12px;background:#eef1f5;border-radius:6px;overflow:hidden}.st-fill{display:block;height:100%;border-radius:6px}.st-fill.ok{background:var(--teal)}.st-fill.weak{background:#d89a2b}.st-fill.few{background:repeating-linear-gradient(45deg,#d5dbe3 0 6px,#e6eaef 6px 12px)}
.st-v{font-weight:700;text-align:right;font-size:14px}.st-callout{border-left:5px solid #d89a2b;background:#fff7e8;border-radius:10px;padding:12px}.st-wname{font-size:20px;font-weight:800;color:var(--navy)}
.st-go{display:inline-block;margin-top:8px;background:var(--teal);color:#fff;border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:700}
.st-grid{stroke:var(--line);stroke-width:1}.st-ax{font-size:10px;fill:var(--muted)}.st-pl{fill:none;stroke:var(--teal);stroke-width:2.5}.st-pt{fill:#fff;stroke:var(--navy);stroke-width:2}
.st-legend{font-size:12px;color:var(--muted)}.st-legend i{display:inline-block;width:12px;height:8px;border-radius:3px;margin:0 4px 0 8px;vertical-align:middle}
.st-title{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;text-align:center}.st-tlab{font-size:12px;opacity:.85}.st-tname{font-size:26px;font-weight:900;margin:2px 0}.st-tsub{font-size:12px;opacity:.9}.st-next{margin-top:8px;background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;font-size:13px}
.st-two{display:grid;grid-template-columns:1fr;gap:0}@media(min-width:560px){.st-two{grid-template-columns:1fr 1fr;gap:14px}}
.st-mini{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;margin-bottom:6px;text-decoration:none;color:var(--ink)}.st-mini small{display:block;color:var(--muted);font-size:11px;font-weight:400}.st-mv{font-weight:800;text-align:right;white-space:nowrap}
.st-mini.good{background:var(--tint)}.st-mini.grow{background:#fff7e8;border-left:4px solid #d89a2b}
</style>
    <script src="../backnav.js"></script>
  </head>
  <body class="jkq-body">
    <a class="jkq-return" href="../">← ポータルへ</a>
    <main class="st">
      <header class="jkq-head">
        <div class="jkq-mark" aria-hidden="true">📊</div>
        <div><h1>じぶんのパラメータ</h1><p class="muted">この端末の記録だけで計算しています（どこにも送信しません）。</p></div>
      </header>
      <section id="empty" class="card" hidden><h2>まだ記録がありません</h2><p>過去問・4択クイズ・うでだめしを解くと、ここに正解率や弱い分野が出ます。</p><a class="st-go" href="../jitsuryoku/">うでだめしをやってみる →</a></section>
      <div id="main" hidden>
        <section class="card st-title" id="title"></section>
        <section class="card"><div class="st-bigs" id="big"></div></section>
        <section class="card"><h2>直近10回のうでだめし（正解率％）</h2><div id="line"></div></section>
        <section class="card"><h2>教科ごとの正解率</h2><div id="subj"></div><p class="st-legend"><i style="background:var(--teal)"></i>60%以上<i style="background:#d89a2b"></i>60%未満<i style="background:#d5dbe3"></i>5問未満</p></section>
        <div class="st-two"><section class="card" id="good"></section><section class="card" id="grow"></section></div>
      </div>
    </main>
    <script>window.STATS_CFG={"gameKey": "jkp-game-v1", "wjScoreKey": "jkp-wj-scores-v1", "wjLogKey": "jkp-wj-log-v1", "subjects": [{"src": "ana", "label": "解剖学", "kind": "fields", "data": "../anatomy/fields.json", "app": "../anatomy/"}, {"src": "phy", "label": "生理学", "kind": "fields", "data": "../physiology/fields.json", "app": "../physiology/"}, {"src": "cli", "label": "一般臨床医学", "kind": "category", "data": "../clinical/questions.json", "app": "../clinical/"}], "wjLabel": {"解剖学": "解剖学", "生理学": "生理学", "一般臨床医学": "一般臨床医学"}, "order": ["解剖学", "生理学", "一般臨床医学"], "flavor": {"解剖学": {"w": "解剖の"}, "生理学": {"w": "生理の"}, "一般臨床医学": {"w": "臨床の"}}};</script>
    <script src="./stats.js"></script>
  </body>
</html>
