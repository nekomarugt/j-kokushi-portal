<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="sans-serif" font-size="13"><rect width="500" height="280" fill="#fff"/><text x="20" y="24" font-weight="bold" font-size="14">膝の靱帯：どの向きのずれを止めるか（模式図）</text>
<rect x="90" y="45" width="140" height="80" rx="30" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/><text x="135" y="80">大腿骨</text>
<rect x="95" y="160" width="130" height="90" rx="12" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/><text x="140" y="215">脛骨</text>
<line x1="145" y1="122" x2="175" y2="162" stroke="#c0392b" stroke-width="5"/><line x1="175" y1="122" x2="145" y2="162" stroke="#2980b9" stroke-width="5"/>
<line x1="92" y1="110" x2="98" y2="175" stroke="#1e8449" stroke-width="6"/><line x1="228" y1="110" x2="222" y2="175" stroke="#8e44ad" stroke-width="6"/>
<text x="30" y="145" fill="#1e8449">内側側副靱帯</text><text x="236" y="145" fill="#8e44ad">外側側副靱帯</text>
<text x="270" y="60" fill="#c0392b">前十字靱帯：脛骨が前へずれるのを止める</text><text x="282" y="78" font-size="12">→ 前方引き出し・ラックマンテスト</text>
<text x="270" y="105" fill="#2980b9">後十字靱帯：脛骨が後ろへずれるのを止める</text><text x="282" y="123" font-size="12">→ 後方引き出し・脛骨の後方落ち込み</text>
<text x="270" y="190" fill="#1e8449">内側側副靱帯：外反を止める</text><text x="282" y="208" font-size="12">→ 外反ストレステスト</text>
<text x="270" y="235" fill="#8e44ad">外側側副靱帯：内反を止める</text><text x="282" y="253" font-size="12">→ 内反ストレステスト</text></svg>
