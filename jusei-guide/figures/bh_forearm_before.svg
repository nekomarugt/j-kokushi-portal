<text x="470" y="386" font-size="10" fill="#555">（方形回内筋）</text>
<text x="16" y="428" font-size="10" fill="#555">断面マーク：●が真上＝中間位、外へ回る＝回外、内へ回る＝回内（模式）。尺骨は折れていない想定。</text>
