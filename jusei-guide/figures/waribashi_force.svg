<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><rect width="600" height="330" fill="#fff"/>
<text x="16" y="24" font-weight="bold" font-size="15">割り箸で考える：押す・ねじる・引っぱる</text>
<line x1="200" y1="40" x2="200" y2="318" stroke="#ddd"/><line x1="400" y1="40" x2="400" y2="318" stroke="#ddd"/>
<!-- 圧迫 -->
<text x="16" y="60" font-weight="bold">圧迫：机に押しつける</text>
<rect x="20" y="214" width="160" height="12" fill="#95a5a6"/><text x="70" y="242" font-size="11">机（床）</text>
<rect x="94" y="96" width="14" height="118" fill="#d4a373"/>
<line x1="101" y1="70" x2="101" y2="94" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/><text x="110" y="84" font-size="11" fill="#c0392b">長軸方向に押す</text>
<path d="M90,190 L112,196 M90,198 L112,204 M88,206 L114,210" stroke="#2c3e50" stroke-width="2"/>
<text x="16" y="262" font-size="11">端がつぶれる・折れた端どうしが</text>
<text x="16" y="278" font-size="11">めり込んで噛み合う</text>
<text x="16" y="296" font-size="11" fill="#555">→ 圧迫骨折・嵌入（噛み合い）</text>
<text x="16" y="312" font-size="11" fill="#555">例：椎体、踵からの着地</text>
<!-- 捻転 -->
<text x="216" y="60" font-weight="bold">捻転：両手でねじる</text>
<rect x="230" y="146" width="140" height="16" fill="#d4a373"/>
<path d="M240,128 q-14,26 0,52" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M360,180 q14,-26 0,-52" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="216" y="118" font-size="11" fill="#c0392b">反対向きにねじる</text>
<path d="M270,146 C285,150 290,162 305,162 M305,146 C320,150 325,162 340,162" stroke="#2c3e50" stroke-width="2.5" fill="none"/>
<text x="216" y="214" font-size="11">割れ目が骨のまわりを斜めに</text>
<text x="216" y="230" font-size="11">回り込む</text>
<text x="216" y="248" font-size="11" fill="#555">→ 螺旋状骨折</text>
<text x="216" y="266" font-size="11" fill="#555">例：投球骨折・腕相撲骨折、</text>
<text x="216" y="282" font-size="11" fill="#555">スキーでの下腿骨骨折</text>
<!-- 裂離 -->
<text x="416" y="60" font-weight="bold">裂離：付いた紐で引っぱる</text>
<rect x="430" y="146" width="110" height="16" fill="#d4a373"/>
<path d="M540,146 L556,146 L556,162 L540,162z" fill="#f5cba7" stroke="#2c3e50" transform="translate(10 -6) rotate(-12 548 154)"/>
<path d="M566,148 Q580,120 586,96" stroke="#8e44ad" stroke-width="4" fill="none"/>
<line x1="584" y1="112" x2="590" y2="84" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="470" y="100" font-size="11" fill="#8e44ad">紐＝筋・腱・靱帯</text>
<text x="416" y="214" font-size="11">紐の付け根（付着部）の骨が</text>
<text x="416" y="230" font-size="11">小さく引きはがされる</text>
<text x="416" y="248" font-size="11" fill="#555">→ 裂離骨折</text>
<text x="416" y="266" font-size="11" fill="#555">例：第5中足骨基部（短腓骨筋）、</text>
<text x="416" y="282" font-size="11" fill="#555">成長期の骨盤の裂離骨折</text>
</svg>
