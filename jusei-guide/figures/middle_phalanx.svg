<rect x="190" y="134" width="100" height="10" fill="#27ae60"/><text x="175" y="165" fill="#27ae60" font-size="12">浅指屈筋の付着部</text>
<line x1="130" y1="85" x2="130" y2="150" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4"/><text x="70" y="75" font-size="12">付着部より近位→背側凸</text>
