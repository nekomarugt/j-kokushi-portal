<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><rect width="480" height="260" fill="#fff"/><text x="20" y="24" font-weight="bold" font-size="14">少年期の骨盤の裂離骨折：剥がす筋（右側面・模式図）</text>
<path d="M60,60 Q150,40 220,70 L230,120 Q200,170 160,210 L110,215 Q90,160 70,120 Z" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
<circle cx="215" cy="78" r="7" fill="#c0392b"/><line x1="222" y1="82" x2="262" y2="105" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/><text x="268" y="100">上前腸骨棘 ← 縫工筋・大腿筋膜張筋</text>
<circle cx="222" cy="118" r="7" fill="#d68910"/><line x1="228" y1="122" x2="262" y2="140" stroke="#d68910" stroke-width="3" marker-end="url(#a)"/><text x="268" y="140">下前腸骨棘 ← 大腿直筋</text>
<circle cx="125" cy="205" r="8" fill="#2980b9"/><line x1="130" y1="212" x2="160" y2="240" stroke="#2980b9" stroke-width="3" marker-end="url(#a)"/><text x="170" y="240">坐骨結節 ← ハムストリング</text>
<text x="268" y="185" font-size="12">骨端線がまだ閉じていない時期に、</text><text x="268" y="203" font-size="12">筋の強い収縮で付着部ごと剥がれる。</text></svg>
