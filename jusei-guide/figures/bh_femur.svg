<text x="92" y="168" font-size="10" fill="#000">外転（中・小殿筋）</text>
<text x="92" y="182" font-size="10" fill="#000">外旋（大殿筋・外旋筋群）</text>
<text x="92" y="250" font-size="10" fill="#c0392b">遠位骨片：</text>
