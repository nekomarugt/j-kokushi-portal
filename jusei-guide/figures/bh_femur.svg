<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" font-family="sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><rect width="600" height="390" fill="#fff"/>
<text x="16" y="24" font-size="15" fill="#000" font-weight="bold">棒とヒモで考える：大腿骨骨幹部骨折</text>
<text x="16" y="44" font-size="12" fill="#555">近位1/3・中央1/3・遠位1/3で、骨片を引くヒモが変わる（向きは文字で読む）</text>
<line x1="16" y1="64" x2="46" y2="64" stroke="#d4a373" stroke-width="10" stroke-linecap="round"/><text x="52" y="68" font-size="11" fill="#000">骨＝棒</text>
