<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" font-family="sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><rect width="480" height="270" fill="#fff"/><text x="20" y="24" font-weight="bold" font-size="14">肩関節前方（烏口下）脱臼：骨頭の位置（正面から見た模式図）</text>
<path d="M150,70 Q200,60 250,75" fill="none" stroke="#2c3e50" stroke-width="5"/><text x="200" y="58" font-size="12">肩峰（外側に角ばって触れる）</text>
<path d="M120,95 L120,190" stroke="#2c3e50" stroke-width="6"/><text x="40" y="150" font-size="12">関節窩</text><text x="40" y="166" font-size="12">（空になる）</text>
<circle cx="150" cy="140" r="34" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5 4"/><text x="128" y="186" font-size="11" fill="#7f8c8d">元の位置</text>
<path d="M95,105 Q80,100 85,90" fill="none" stroke="#2c3e50" stroke-width="4"/><text x="20" y="92" font-size="12">烏口突起</text>
<circle cx="95" cy="140" r="34" fill="#fdecea" stroke="#c0392b" stroke-width="3"/><text x="70" y="145" font-size="12" fill="#c0392b">骨頭</text>
<line x1="150" y1="140" x2="135" y2="140" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="230" y="130">・骨頭は前下方（烏口突起の下）へ</text><text x="230" y="155">・三角筋のふくらみが消え、肩峰が角ばる</text><text x="230" y="180">・上腕は軽く外転・内旋した位置で</text><text x="242" y="198">弾発性固定</text><text x="230" y="225">・腋窩神経の損傷を確認する</text></svg>
