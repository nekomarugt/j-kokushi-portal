<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 345" font-family="sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><rect width="600" height="345" fill="#fff"/>
<text x="16" y="24" font-size="15" fill="#000" font-weight="bold">棒とヒモで考える：上腕骨骨幹部骨折</text>
<text x="16" y="44" font-size="12" fill="#555">折れた所が三角筋の付着部（●）より上か下かで、それぞれの骨片を引くヒモが入れ替わる</text>
<line x1="16" y1="64" x2="46" y2="64" stroke="#d4a373" stroke-width="10" stroke-linecap="round"/><text x="52" y="68" font-size="11" fill="#000">骨＝棒</text>
<line x1="110" y1="64" x2="140" y2="64" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5 3"/><text x="146" y="68" font-size="11" fill="#000">筋＝ヒモ（●が付く所）</text>
<line x1="290" y1="64" x2="318" y2="64" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/><text x="324" y="68" font-size="11" fill="#000">骨片が引かれる向き</text>

<line x1="300" y1="80" x2="300" y2="330" stroke="#ddd"/><text x="16" y="96" font-size="12" fill="#000" font-weight="bold">a. 付着部より上（近位）で折れる</text>
<text x="16" y="112" font-size="10" fill="#555">正面から見た右上腕（左が外側）</text>
<line x1="150" y1="130" x2="150" y2="142" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
<line x1="150" y1="158" x2="150" y2="310" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
<path d="M141,152 l6,-5 l6,5 l6,-5" stroke="#2c3e50" stroke-width="2.5" fill="none"/>
<circle cx="150" cy="128" r="16" fill="#f5cba7" stroke="#d4a373"/><circle cx="143" cy="190" r="4" fill="#8e44ad"/>
<polyline points="143,190 90,135" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
<text x="40" y="130" font-size="10" fill="#8e44ad">三角筋</text>
<text x="316" y="96" font-size="12" fill="#000" font-weight="bold">b. 付着部より下（遠位）で折れる</text>
<text x="316" y="112" font-size="10" fill="#555">正面から見た右上腕（左が外側）</text>
<line x1="450" y1="130" x2="450" y2="222" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
<line x1="450" y1="238" x2="450" y2="310" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
<path d="M441,232 l6,-5 l6,5 l6,-5" stroke="#2c3e50" stroke-width="2.5" fill="none"/>
<circle cx="450" cy="128" r="16" fill="#f5cba7" stroke="#d4a373"/><circle cx="443" cy="190" r="4" fill="#8e44ad"/>
<polyline points="443,190 390,135" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
<text x="340" y="130" font-size="10" fill="#8e44ad">三角筋</text>
<circle cx="157" cy="140" r="4" fill="#8e44ad"/>
<polyline points="157,140 240,150" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
<text x="210" y="170" font-size="10" fill="#8e44ad">大胸筋・大円筋</text>
<text x="210" y="183" font-size="10" fill="#8e44ad">広背筋</text>
<line x1="160" y1="120" x2="195" y2="120" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="180" y="112" font-size="11" fill="#c0392b">近位骨片：内側へ</text>
<polyline points="143,190 143,170" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
<line x1="138" y1="260" x2="110" y2="232" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="16" y="262" font-size="11" fill="#c0392b">遠位骨片：</text>
<text x="16" y="277" font-size="11" fill="#c0392b">外上方へ</text>
<text x="16" y="300" font-size="10" fill="#555">（三角筋・上腕二頭筋・</text>
<text x="16" y="313" font-size="10" fill="#555">上腕三頭筋・烏口腕筋）</text>
<line x1="438" y1="160" x2="400" y2="160" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="316" y="180" font-size="11" fill="#c0392b">近位骨片：前外側へ</text>
<text x="316" y="194" font-size="10" fill="#555">（三角筋）</text>
<circle cx="457" cy="290" r="4" fill="#8e44ad"/>
<polyline points="457,290 470,140" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
<text x="478" y="200" font-size="10" fill="#8e44ad">上腕二頭筋</text>
<text x="478" y="213" font-size="10" fill="#8e44ad">上腕三頭筋</text>
<line x1="490" y1="290" x2="490" y2="255" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
<text x="498" y="280" font-size="11" fill="#c0392b">遠位骨片：</text>
<text x="498" y="294" font-size="11" fill="#c0392b">後上方へ</text>
<text x="16" y="336" font-size="10" fill="#555">b では骨折部が前外方凸の変形になる。前後の向きは平面図では表せないので文字で示す。</text>
</svg>
