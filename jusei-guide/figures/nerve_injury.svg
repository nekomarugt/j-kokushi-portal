<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" font-family="sans-serif" font-size="13"><rect width="520" height="250" fill="#fff"/><text x="20" y="24" font-weight="bold" font-size="14">末梢神経損傷：セドンの3分類（模式図）</text>
<text x="20" y="62" font-weight="bold">一過性神経伝導障害</text><rect x="190" y="50" width="300" height="16" rx="8" fill="#fef5e7" stroke="#2c3e50"/><line x1="190" y1="58" x2="490" y2="58" stroke="#2980b9" stroke-width="3"/><rect x="320" y="46" width="30" height="24" fill="none" stroke="#c0392b" stroke-dasharray="3 3"/><text x="190" y="88" font-size="11">軸索も鞘も保たれる（伝導だけ止まる）→ 回復が早い</text>
<text x="20" y="132" font-weight="bold">軸索断裂</text><rect x="190" y="120" width="300" height="16" rx="8" fill="#fef5e7" stroke="#2c3e50"/><line x1="190" y1="128" x2="330" y2="128" stroke="#2980b9" stroke-width="3"/><line x1="345" y1="128" x2="490" y2="128" stroke="#2980b9" stroke-width="3" stroke-dasharray="4 4"/><text x="190" y="158" font-size="11">軸索は切れるが鞘（神経内膜など）は残る → 鞘を道しるべに再生</text>
<text x="20" y="202" font-weight="bold">神経断裂</text><rect x="190" y="190" width="135" height="16" rx="8" fill="#fef5e7" stroke="#2c3e50"/><rect x="355" y="190" width="135" height="16" rx="8" fill="#fef5e7" stroke="#2c3e50"/><line x1="190" y1="198" x2="325" y2="198" stroke="#2980b9" stroke-width="3"/><text x="190" y="228" font-size="11">神経そのものが切れる → 自然回復は期待しにくい（縫合が必要）</text></svg>
