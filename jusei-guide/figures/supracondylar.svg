<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="sans-serif" font-size="14"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><rect width="480" height="260" fill="#fff"/><text x="20" y="24" font-weight="bold">上腕骨顆上骨折（側面の模式図）</text>
<g><text x="60" y="55">伸展型（大部分）</text><rect x="90" y="65" width="34" height="100" fill="#ecf0f1" stroke="#2c3e50" stroke-width="3"/>
<rect x="110" y="172" width="34" height="50" fill="#bdc3c7" stroke="#2c3e50" stroke-width="3" transform="rotate(-15 127 197)"/>
<line x1="150" y1="200" x2="185" y2="180" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/><text x="150" y="245" font-size="12">遠位骨片は後上方へ</text></g>
<g><text x="290" y="55">屈曲型</text><rect x="320" y="65" width="34" height="100" fill="#ecf0f1" stroke="#2c3e50" stroke-width="3"/>
<rect x="300" y="172" width="34" height="50" fill="#bdc3c7" stroke="#2c3e50" stroke-width="3" transform="rotate(15 317 197)"/>
<line x1="295" y1="200" x2="260" y2="185" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/><text x="290" y="245" font-size="12">遠位骨片は前方へ</text></g>
<text x="20" y="245" font-size="11" fill="#555">左＝前／右＝後</text></svg>
