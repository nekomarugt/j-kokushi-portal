<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" font-family="sans-serif" font-size="14"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2c3e50"/></marker></defs><rect width="520" height="230" fill="#fff"/><text x="20" y="24" font-weight="bold">骨折の治り方：3つの段階（模式図）</text>
<g><rect x="20" y="50" width="140" height="110" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="40" y="78" font-weight="bold" fill="#c0392b">① 炎症期</text><text x="32" y="104" font-size="12">血腫ができる</text><text x="32" y="124" font-size="12">炎症細胞が集まり</text><text x="32" y="142" font-size="12">壊れた組織を片付ける</text></g>
<g><rect x="190" y="50" width="140" height="110" rx="10" fill="#fef5e7" stroke="#d68910" stroke-width="2"/><text x="208" y="78" font-weight="bold" fill="#d68910">② 修復期</text><text x="202" y="104" font-size="12">仮骨ができ</text><text x="202" y="124" font-size="12">骨片どうしを</text><text x="202" y="142" font-size="12">橋渡しする</text></g>
<g><rect x="360" y="50" width="140" height="110" rx="10" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/><text x="372" y="78" font-weight="bold" fill="#1e8449">③ リモデリング期</text><text x="372" y="104" font-size="12">余分な仮骨が削られ</text><text x="372" y="124" font-size="12">力のかかり方に合った</text><text x="372" y="142" font-size="12">形に作り直される</text></g>
<line x1="162" y1="105" x2="186" y2="105" stroke="#2c3e50" stroke-width="2" marker-end="url(#a)"/><line x1="332" y1="105" x2="356" y2="105" stroke="#2c3e50" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="195" font-size="12">骨片の安定（固定）と血流が保たれるほど、②③が順調に進む。</text><text x="20" y="215" font-size="12">動揺が続く・血流が乏しい → 遷延治癒・偽関節へ。</text></svg>
