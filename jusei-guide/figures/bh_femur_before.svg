<text x="202" y="172" font-size="9" fill="#8e44ad">ハムストリングス</text>
<text x="208" y="352" font-size="9" fill="#888">← 外側</text>
<text x="354" y="352" font-size="9" fill="#888">内側 →</text>
<text x="216" y="365" font-size="10" fill="#c0392b">近位骨片：内転（内へ傾く）</text>
<text x="216" y="379" font-size="10" fill="#555">＋屈曲（つり合えば中間位）</text>
<text x="216" y="398" font-size="10" fill="#c0392b">遠位骨片：後上方へ</text>
<text x="216" y="412" font-size="10" fill="#555">（上へ重なり短縮）</text>
<text x="416" y="96" font-size="12" fill="#000" font-weight="bold">c. 遠位1/3</text>
<line x1="480" y1="134" x2="510" y2="108" stroke="#d4a373" stroke-width="12" stroke-linecap="round"/><circle cx="510" cy="108" r="13" fill="#f5cba7" stroke="#d4a373"/><circle cx="471" cy="130" r="8" fill="#d4a373"/><circle cx="489" cy="156" r="6" fill="#d4a373"/><text x="408" y="352" font-size="9" fill="#888">← 外側</text>
<text x="554" y="352" font-size="9" fill="#888">内側 →</text>
<line x1="480" y1="134" x2="480" y2="242" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
<circle cx="480" cy="242" r="3" fill="#2c3e50"/><line x1="480" y1="325" x2="480" y2="258" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
<circle cx="480" cy="258" r="3" fill="#2c3e50"/><circle cx="480" cy="304" r="4" fill="#8e44ad"/>
<polyline points="480,304 550,180" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
<circle cx="480" cy="333" r="10" fill="#f5cba7" stroke="#d4a373"/><text x="520" y="175" font-size="9" fill="#8e44ad">腓腹筋・</text>
<text x="520" y="187" font-size="9" fill="#8e44ad">ハムストリングス</text>
<text x="416" y="365" font-size="10" fill="#c0392b">近位骨片：ほぼ中間位</text>
<text x="416" y="379" font-size="10" fill="#555">（まっすぐのまま）</text>
<text x="416" y="398" font-size="10" fill="#c0392b">遠位骨片：強く後方へ（文字で）</text>
<text x="416" y="412" font-size="10" fill="#555">＋上へ重なり短縮</text>
<text x="16" y="436" font-size="10" fill="#555">灰色の点線＝折れる前のまっすぐな骨。ヒモ（筋）は代表だけ。</text>
<rect x="476" y="442" width="118" height="40" rx="6" fill="#f8f9fa" stroke="#ccc"/><text x="482" y="457" font-size="9" fill="#555">↑近位(上) ↓遠位(下)</text>
<text x="482" y="474" font-size="9" fill="#555">←外側　内側(骨頭)→</text>
</svg>
