<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 488" font-family="sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker></defs><rect width="600" height="488" fill="#fff"/>
<text x="16" y="24" font-size="15" fill="#000" font-weight="bold">棒とヒモで考える：大腿骨骨幹部骨折</text>
<rect x="470" y="10" width="118" height="24" rx="12" fill="#7f8c8d"/><text x="488" y="27" font-size="10" fill="#fff" font-weight="bold">転位前（折れた直後）</text>
<text x="16" y="44" font-size="12" fill="#555">右大腿を前から見た図（左＝外側、右＝内側・骨頭側）。屈曲・後方・外旋は正面図に出ないので文字で示す</text>
<line x1="16" y1="64" x2="46" y2="64" stroke="#d4a373" stroke-width="10" stroke-linecap="round"/><text x="52" y="68" font-size="11" fill="#000">骨＝棒</text>
<line x1="110" y1="64" x2="140" y2="64" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5 3"/><text x="146" y="68" font-size="11" fill="#000">筋＝ヒモ（●が付く所）</text>
<line x1="290" y1="64" x2="318" y2="64" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/><text x="324" y="68" font-size="11" fill="#000">骨片が引かれる向き</text>


<line x1="200" y1="80" x2="200" y2="420" stroke="#ddd"/><line x1="400" y1="80" x2="400" y2="420" stroke="#ddd"/><text x="16" y="96" font-size="12" fill="#000" font-weight="bold">a. 近位1/3</text>
