<text x="520" y="187" font-size="9" fill="#8e44ad">ハムストリングス</text>
<text x="416" y="365" font-size="10" fill="#c0392b">近位骨片：ほぼ中間位</text>
<text x="416" y="379" font-size="10" fill="#555">（まっすぐのまま）</text>
<text x="416" y="398" font-size="10" fill="#c0392b">遠位骨片：強く後方へ（文字で）</text>
<text x="416" y="412" font-size="10" fill="#555">＋上へ重なり短縮</text>
<text x="16" y="436" font-size="10" fill="#555">灰色の点線＝折れる前のまっすぐな骨。ヒモ（筋）は代表だけ。</text>
</svg>
