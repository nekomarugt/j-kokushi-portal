<text x="4" y="250" font-size="9" fill="#8e44ad">中・小殿筋</text>
<text x="142" y="88" font-size="9" fill="#8e44ad">腸腰筋</text>
<text x="120" y="250" font-size="9" fill="#8e44ad">内転筋群</text>
<text x="8" y="352" font-size="9" fill="#888">← 外側</text>
<text x="154" y="352" font-size="9" fill="#888">内側 →</text>
<text x="16" y="365" font-size="10" fill="#c0392b">近位骨片：外転（外へ傾く）</text>
<text x="16" y="379" font-size="10" fill="#555">＋屈曲・外旋（文字で）</text>
<text x="16" y="398" font-size="10" fill="#c0392b">遠位骨片：内上方へ短縮</text>
<text x="16" y="412" font-size="10" fill="#555">近位骨片の後ろに重なる</text>
<text x="216" y="96" font-size="12" fill="#000" font-weight="bold">b. 中央1/3（最多）</text>
<line x1="280" y1="134" x2="310" y2="108" stroke="#d4a373" stroke-width="12" stroke-linecap="round"/><circle cx="310" cy="108" r="13" fill="#f5cba7" stroke="#d4a373"/><circle cx="271" cy="130" r="8" fill="#d4a373"/><circle cx="289" cy="156" r="6" fill="#d4a373"/><line x1="280" y1="134" x2="280" y2="213" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
