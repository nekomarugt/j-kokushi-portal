<text x="124" y="135" font-size="9" fill="#8e44ad">腸腰筋</text>
<text x="110" y="250" font-size="9" fill="#8e44ad">内転筋群</text>
<text x="16" y="365" font-size="10" fill="#c0392b">近位骨片：外転（外へ傾く）</text>
<text x="16" y="379" font-size="10" fill="#555">＋屈曲・外旋（文字で）</text>
<text x="16" y="398" font-size="10" fill="#c0392b">遠位骨片：内上方へ短縮</text>
<text x="16" y="412" font-size="10" fill="#555">近位骨片の後ろに重なる</text>
<text x="216" y="96" font-size="12" fill="#000" font-weight="bold">b. 中央1/3（最多）</text>
<circle cx="266" cy="122" r="13" fill="#f5cba7" stroke="#d4a373"/><line x1="280" y1="132" x2="280" y2="213" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
