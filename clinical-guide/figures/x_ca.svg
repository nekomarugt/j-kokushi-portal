<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" width="560" height="490" role="img" aria-label="カルシウムの解剖・生理・臨床のつながり図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>カルシウムの解剖・生理・臨床のつながり図</title><rect width="560" height="490" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="280.0" y="32" font-size="22" fill="#073b6a" font-weight="bold" text-anchor="middle" >つながり：カルシウム</text><rect x="12" y="52" width="536" height="96" rx="12" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><rect x="12" y="52" width="92" height="96" rx="12" fill="#0b5ea8" stroke="#0b5ea8" stroke-width="2" /><text x="58" y="107.0" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >解剖学</text><text x="118" y="86" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="start" >上皮小体（副甲状腺）</text><text x="118" y="116" font-size="18" fill="#142638" font-weight="normal" text-anchor="start" >甲状腺のうしろにある小さな腺</text><line x1="58" y1="150" x2="58" y2="166" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="168" width="536" height="96" rx="12" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><rect x="12" y="168" width="92" height="96" rx="12" fill="#2e8b57" stroke="#2e8b57" stroke-width="2" /><text x="58" y="223.0" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >生理学</text><text x="118" y="202" font-size="18" fill="#2e8b57" font-weight="bold" text-anchor="start" >PTHと活性型ビタミンDは血中Caを上げる</text><text x="118" y="232" font-size="18" fill="#142638" font-weight="normal" text-anchor="start" >カルシトニンは骨吸収を抑える</text><line x1="58" y1="266" x2="58" y2="282" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="284" width="536" height="96" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><rect x="12" y="284" width="92" height="96" rx="12" fill="#cf2634" stroke="#cf2634" stroke-width="2" /><text x="58" y="339.0" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >臨床</text><text x="118" y="318" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >Caが低いとテタニー（けいれん）</text><text x="118" y="348" font-size="18" fill="#142638" font-weight="normal" text-anchor="start" >腎臓が悪いとCaが下がる</text><rect x="12" y="398" width="536" height="80" rx="12" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="428" font-size="17" fill="#b77a00" font-weight="bold" text-anchor="start" >たとえ</text><text x="28" y="452" font-size="18" fill="#142638" font-weight="normal" text-anchor="start" >血中Ca＝家計簿の残高。減るとPTHが取り立て屋に。</text><text x="28" y="480" font-size="18" fill="#142638" font-weight="normal" text-anchor="start" >骨から出す・腎で節約・腸から仕入れる。</text></svg>