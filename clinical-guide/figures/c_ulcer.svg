="116" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >ピロリ菌</text><text x="154" y="136" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >（NSAIDs・ストレス）</text><rect x="306" y="78" width="200" height="72" rx="12" fill="#e4effa" stroke="#0b5ea8" stroke-width="2.5" /><text x="406" y="104" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >防御因子</text><text x="406" y="130" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >粘液（HCO₃⁻）・PG</text></g><text x="280" y="218" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="middle" >攻撃 ＞ 防御 に傾くと、粘膜下層より深く欠損＝潰瘍</text><rect x="132" y="250" width="206" height="36" rx="8" fill="#fdebdc" stroke="#c2570c" stroke-width="2" /><text x="235.0" y="274" font-size="16" fill="#c2570c" font-weight="bold" text-anchor="middle" >胃潰瘍</text><rect x="342" y="250" width="206" height="36" rx="8" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><text x="445.0" y="274" font-size="16" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >十二指腸潰瘍</text><rect x="10" y="292" width="540" height="34.0" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="314.22" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >痛む時間</text><text x="235.0" y="314.22" font-size="14.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >食後</text><text x="445.0" y="314.22" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >空腹時（夜間）</text><rect x="10" y="330.0" width="540" height="34.0" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="352.22" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >好発年齢</text><text x="235.0" y="352.22" font-size="14.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >40〜50歳代</text><text x="445.0" y="352.22" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >30〜40歳代</text><rect x="10" y="368.0" width="540" height