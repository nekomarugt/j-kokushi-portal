<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 434" width="560" height="434" role="img" aria-label="脳出血の部位による共同偏視の違い" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>脳出血の部位による共同偏視の違い</title><rect width="560" height="434" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><text x="14" y="22" font-size="13.5" fill="#607487" font-weight="bold" text-anchor="start" >患者の顔を正面から見た図。“病巣”＝出血した側（ここでは患者の右）</text><rect x="10" y="34" width="266" height="150" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2" /><text x="22" y="60" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >被殻出血</text><text x="22" y="82" font-size="14" fill="#142638" font-weight="bold" text-anchor="start" >病巣側を向く</text><ellipse cx="103" cy="134" rx="30" ry="18" fill="#fff" stroke="#607487" stroke-width="2"/><circle cx="87" cy="134" r="10" fill="#cf2634" stroke="#cf2634" stroke-width="1"/><ellipse cx="183" cy="134" rx="30" ry="18" fill="#fff" stroke="#607487" stroke-width="2"/><circle cx="167" cy="134" r="10" fill="#cf2634" stroke="#cf2634" stroke-width="1"/><rect x="15.0" y="121" width="42.0" height="26" rx="13" fill="#cf2634"/><text x="36" y="138.32" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" >病巣</text><rect x="284" y="34" width="266" height="150" rx="10" fill="#fff" stroke="#6a4fb3" stroke-width="2" /><text x="296" y="60" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="start" >視床出血</text><text x="296" y="82" font-size="14" fill="#142638" font-weight="bold" text-anchor="start" >内下方（鼻先）をにらむ</text><ellipse cx="377" cy="134" rx="30" ry="18" fill="#fff" stroke="#607487" stroke-width="2"/><circle cx="386" cy="141" r="10" fill="#6a4fb3" stroke="#6a4fb3" stroke-width="1"/><ellipse cx="457" cy="134" rx="30" ry="18" fill="#fff" stroke="#607487" stroke-width="2"/><circle cx="448" cy="141" r="10" fill="#6a4fb3" stroke="#6a4fb3" stroke-width="1"/><rect x="289.0" y="121" width="42.0" height="26" rx="13" fill="#cf2634"/><text x="310" y="138.32" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" >病巣</text><rect x="10" y="196" width="266" height="150" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2" /><text x="22" y="222" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="start" >小脳出血</text><text x="22" y="244" font-size="14" fill="#142638" font-weight="bold" text-anchor="start" >反対側（健側）を向く</text><ellipse cx="103" cy="296" rx="30" ry="18" fill="#fff" stroke="#607487" stroke-width="2"/><circle cx="119" cy="296" r="10" fill="#0b5ea8" stroke="#0b5ea8" stroke-width="1"/><ellipse cx="183" cy="296" rx="30" ry="18" fill="#fff" stroke="#607487" stroke-width="2"/><circle cx="199" cy="296" r="10" fill="#0b5ea8" stroke="#0b5ea8" stroke-width="1"/><rect x="15.0" y="283" width="42.0" height="26" rx="13" fill="#cf2634"/><text x="36" y="300.32" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" >病巣</text><rect x="284" y="196" width="266" height="150" rx="10" fill="#fff" stroke="#9aa9b8" stroke-width="2" /><text x="296" y="222" font-size="17" fill="#9aa9b8" font-weight="bold" text-anchor="start" >橋出血（参考）</text><text x="296" y="244" font-size="14" fill="#142638" font-weight="bold" text-anchor="start" >正中位・著明な縮瞳</text><ellipse cx="377" cy="296" rx="30" ry="18" fill="#fff" stroke="#607487" stroke-width="2"/><circle cx="377" cy="296" r="5" fill="#9aa9b8" stroke="#9aa9b8" stroke-width="1"/><ellipse cx="457" cy="296" rx="30" ry="18" fill="#fff" stroke="#607487" stroke-width="2"/><circle cx="457" cy="296" r="5" fill="#9aa9b8" stroke="#9aa9b8" stroke-width="1"/><rect x="10" y="360" width="540" height="64" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="385" font-size="15" fill="#cf2634" font-weight="bold" text-anchor="start" >被殻出血は“病巣をにらむ”（反対側の片麻痺を伴う）</text><text x="22" y="410" font-size="14" fill="#607487" font-weight="normal" text-anchor="start" >同じ脳出血でも、部位で目の向きが変わる</text></svg>