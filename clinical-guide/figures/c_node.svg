<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 343" width="560" height="343" role="img" aria-label="炎症のリンパ節と癌の転移のリンパ節の触診での違いの表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>炎症のリンパ節と癌の転移のリンパ節の触診での違いの表</title><rect width="560" height="343" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="234.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >炎症（反応性）</text><text x="443.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >癌の転移</text><rect x="12" y="58" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="86.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >硬さ</text><text x="234.0" y="86.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >やわらかい</text><text x="443.0" y="86.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >硬い</text><rect x="12" y="110" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="138.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >動き</text><text x="234.0" y="138.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >よく動く</text><text x="443.0" y="138.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >動かない（固定）</text><rect x="12" y="162" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="190.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >痛み</text><text x="234.0" y="190.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >押すと痛い</text><text x="443.0" y="190.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >痛みが少ない</text><rect x="12" y="214" width="536" height="71" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="255.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >場所</text><text x="234.0" y="254.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >頸部・腋窩・鼠径など</text><text x="443.0" y="243.3" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >左鎖骨上窩</text><text x="443.0" y="265.3" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >（胃癌のウィルヒョウ転移）</text><rect x="12" y="293" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="318" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >触れるリンパ節：頸部・鎖骨上窩・腋窩・鼠径</text></svg>