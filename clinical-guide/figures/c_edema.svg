<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" width="560" height="580" role="img" aria-label="浮腫の4つの成因を毛細血管で示した模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>浮腫の4つの成因を毛細血管で示した模式図</title><rect width="560" height="580" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="10" y="10" width="540" height="280" rx="12" fill="#fbf8ef" stroke="#d8e4ee" stroke-width="2" /><text x="24" y="36" font-size="15" fill="#607487" font-weight="bold" text-anchor="start" >組織（間質）</text><rect x="40" y="120" width="480" height="56" rx="28" fill="#fdecee" stroke="#cf2634" stroke-width="3"/><text x="56" y="154" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="start" >毛細血管</text><text x="60" y="110" font-size="13.5" fill="#607487" font-weight="normal" text-anchor="start" >動脈側</text><text x="500" y="110" font-size="13.5" fill="#607487" font-weight="normal" text-anchor="end" >静脈側</text><rect x="150" y="116" width="26" height="8" fill="#fbf8ef"/><line x1="163" y1="118" x2="163" y2="64" stroke="#c2570c" stroke-width="3" marker-end="url(#aho)"/><rect x="146.5" y="39" width="33.0" height="26" rx="13" fill="#c2570c"/><text x="163" y="57.4" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" >①</text><line x1="250" y1="130" x2="250" y2="76" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><line x1="280" y1="130" x2="280" y2="76" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><rect x="248.5" y="39" width="33.0" height="26" rx="13" fill="#cf2634"/><text x="265" y="57.4" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" >②</text><circle cx="350" cy="140" r="7" fill="#fff" stroke="#0b5ea8" stroke-width="2.5"/><circle cx="400" cy="158" r="7" fill="#fff" stroke="#0b5ea8" stroke-width="2.5"/><line x1="390" y1="70" x2="390" y2="114" stroke="#0b5ea8" stroke-width="2.5" marker-end="url(#ahb)" stroke-dasharray="5 4"/><rect x="373.5" y="39" width="33.0" height="26" rx="13" fill="#0b5ea8"/><text x="390" y="57.4" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" >③</text><text x="420" y="154" font-size="13" fill="#0b5ea8" font-weight="normal" text-anchor="start" >アルブミン</text><rect x="120" y="222" width="300" height="30" rx="15" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2.5"/><text x="134" y="243" font-size="14" fill="#2e8b57" font-weight="bold" text-anchor="start" >リンパ管</text><line x1="300" y1="226" x2="320" y2="248" stroke="#cf2634" stroke-width="4"/><line x1="320" y1="226" x2="300" y2="248" stroke="#cf2634" stroke-width="4"/><rect x="433.5" y="224" width="33.0" height="26" rx="13" fill="#2e8b57"/><text x="450" y="242.4" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" >④</text><text x="24" y="280" font-size="14.5" fill="#142638" font-weight="bold" text-anchor="start" >水が組織にたまる＝組織間液（間質液）の増加</text><rect x="10" y="302" width="266" height="90" rx="10" fill="#fdebdc" stroke="#c2570c" stroke-width="2" /><text x="22" y="328" font-size="16.5" fill="#c2570c" font-weight="bold" text-anchor="start" >① 血管透過性の亢進</text><text x="22" y="351.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >炎症で壁にすき間</text><text x="22" y="375.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >例：炎症・クインケ浮腫</text><rect x="284" y="302" width="266" height="90" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="296" y="328" font-size="16.5" fill="#cf2634" font-weight="bold" text-anchor="start" >② 毛細血管圧の上昇</text><text x="296" y="351.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >押し出す力が強まる</text><text x="296" y="375.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >例：うっ血・心不全</text><rect x="10" y="400" width="266" height="90" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="22" y="426" font-size="16.5" fill="#0b5ea8" font-weight="bold" text-anchor="start" >③ 血漿蛋白量の低下</text><text x="22" y="449.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >引き戻す力（膠質浸透圧）↓</text><text x="22" y="473.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >例：低アルブミン血症</text><rect x="284" y="400" width="266" height="90" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="296" y="426" font-size="16.5" fill="#2e8b57" font-weight="bold" text-anchor="start" >④ リンパ管の閉塞</text><text x="296" y="449.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >回収路がふさがる</text><text x="296" y="473.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >例：フィラリア・乳癌術後</text><rect x="10" y="504" width="540" height="66" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="528" font-size="15.5" fill="#073b6a" font-weight="bold" text-anchor="start" >体液：細胞内液40％・細胞外液20％</text><text x="22" y="554" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >細胞外液20％＝組織間液15％＋血漿5％（体重比）</text></svg>