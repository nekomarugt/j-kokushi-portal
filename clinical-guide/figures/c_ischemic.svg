<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 456" width="560" height="456" role="img" aria-label="狭心症と心筋梗塞の比較" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>狭心症と心筋梗塞の比較</title><rect width="560" height="456" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="10" y="10" width="266" height="118" rx="10" fill="#fdebdc" stroke="#c2570c" stroke-width="2" /><text x="22" y="34" font-size="18" fill="#c2570c" font-weight="bold" text-anchor="start" >狭心症</text><rect x="30" y="56" width="226" height="40" rx="20" fill="#fff" stroke="#c2570c" stroke-width="2.5"/><path d="M110,56 Q143,72 176,56 Z" fill="#e9c46a" stroke="#b77a00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M110,96 Q143,80 176,96 Z" fill="#e9c46a" stroke="#b77a00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="143" y="114" font-size="12.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >狭窄（一時的に不足）</text><line x1="40" y1="76" x2="100" y2="76" stroke="#cf2634" stroke-width="2.5" marker-end="url(#ahr)"/><rect x="284" y="10" width="266" height="118" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="296" y="34" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >心筋梗塞</text><rect x="304" y="56" width="226" height="40" rx="20" fill="#fff" stroke="#cf2634" stroke-width="2.5"/><rect x="394" y="56" width="46" height="40" fill="#e9c46a" stroke="#b77a00" stroke-width="2"/><text x="417" y="114" font-size="12.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >血栓で閉塞</text><rect x="444" y="62" width="80" height="28" rx="10" fill="#caa"/><text x="484" y="81" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" >壊死</text><line x1="314" y1="76" x2="374" y2="76" stroke="#cf2634" stroke-width="2.5" marker-end="url(#ahr)"/><rect x="112" y="140" width="216" height="36" rx="8" fill="#fdebdc" stroke="#c2570c" stroke-width="2" /><text x="220.0" y="164" font-size="16" fill="#c2570c" font-weight="bold" text-anchor="middle" >狭心症</text><rect x="332" y="140" width="216" height="36" rx="8" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="440.0" y="164" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >心筋梗塞</text><rect x="10" y="182" width="540" height="38.0" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="206.22" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >病態</text><text x="220.0" y="206.22" font-size="14.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >一過性の心筋虚血</text><text x="440.0" y="206.22" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >心筋壊死（不可逆）</text><rect x="10" y="224.0" width="540" height="56.85" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="257.64500000000004" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >胸痛</text><text x="220.0" y="248.22" font-size="14.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >数分〜15分で</text><text x="220.0" y="267.07" font-size="14.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >安静で消失</text><text x="440.0" y="248.22" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >持続する</text><text x="440.0" y="267.07" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >（20分以上が目安）</text><rect x="10" y="284.85" width="540" height="38.0" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="309.07000000000005" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >ニトロ</text><text x="220.0" y="309.07000000000005" font-size="14.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >有効</text><text x="440.0" y="309.07000000000005" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >無効</text><rect x="10" y="326.85" width="540" height="56.85" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="360.49500000000006" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >心電図</text><text x="220.0" y="351.07000000000005" font-size="14.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >ST低下</text><text x="220.0" y="369.9200000000001" font-size="14.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >（異型はST上昇）</text><text x="440.0" y="351.07000000000005" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >ST上昇 → 異常Q波</text><text x="440.0" y="369.9200000000001" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >→ 冠性T波</text><rect x="10" y="387.70000000000005" width="540" height="56.85" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="421.3450000000001" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >血液</text><text x="220.0" y="421.3450000000001" font-size="14.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >変化なし</text><text x="440.0" y="411.9200000000001" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >心筋トロポニン↑</text><text x="440.0" y="430.7700000000001" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >（CK-MBなど）</text></svg>