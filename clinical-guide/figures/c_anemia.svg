<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 508" width="560" height="508" role="img" aria-label="赤血球の大きさと色による貧血の分類" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>赤血球の大きさと色による貧血の分類</title><rect width="560" height="508" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="10" y="10" width="540" height="125" rx="10" fill="#fdebdc" stroke="#c2570c" stroke-width="2" /><circle cx="56" cy="72.5" r="30" fill="#fff" stroke="#c2570c" stroke-width="2"/><circle cx="56" cy="72.5" r="14" fill="#f7cdd0" stroke="#cf2634" stroke-width="2"/><text x="100" y="38" font-size="17.5" fill="#c2570c" font-weight="bold" text-anchor="start" >小球性・低色素性</text><text x="250.0" y="38" font-size="13.5" fill="#607487" font-weight="normal" text-anchor="start" >粒が小さく色が薄い</text><text x="100" y="64" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >鉄欠乏性貧血（最多）</text><text x="100" y="87" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >フェリチン↓・血清鉄↓</text><text x="100" y="110" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >スプーン状爪</text><rect x="10" y="145" width="540" height="125" rx="10" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><circle cx="56" cy="207.5" r="30" fill="#fff" stroke="#6a4fb3" stroke-width="2"/><circle cx="56" cy="207.5" r="24" fill="#f2a0a6" stroke="#cf2634" stroke-width="2"/><text x="100" y="173" font-size="17.5" fill="#6a4fb3" font-weight="bold" text-anchor="start" >大球性</text><text x="162.5" y="173" font-size="13.5" fill="#607487" font-weight="normal" text-anchor="start" >粒が大きい</text><text x="100" y="199" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >巨赤芽球性貧血</text><text x="100" y="222" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >ビタミンB12・葉酸の欠乏</text><text x="100" y="245" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >ハンター舌炎・振動覚↓</text><rect x="10" y="280" width="540" height="148" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><circle cx="56" cy="354.0" r="30" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><circle cx="56" cy="354.0" r="18" fill="#f2a0a6" stroke="#cf2634" stroke-width="2"/><text x="100" y="308" font-size="17.5" fill="#0b5ea8" font-weight="bold" text-anchor="start" >正球性・正色素性</text><text x="250.0" y="308" font-size="13.5" fill="#607487" font-weight="normal" text-anchor="start" >大きさ・色は普通</text><text x="100" y="334" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >溶血性：間接ビリルビン↑</text><text x="100" y="357" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >　黄疸・脾腫</text><text x="100" y="380" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >再生不良性：汎血球減少</text><text x="100" y="403" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >　脾腫なし</text><rect x="10" y="438" width="540" height="60" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="463" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >悪性貧血＝胃の内因子への自己免疫 → B12吸収不良</text><text x="22" y="486" font-size="14" fill="#607487" font-weight="normal" text-anchor="start" >赤血球の寿命は約120日、血小板は約10日</text></svg>