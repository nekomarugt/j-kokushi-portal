<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-label="A型・B型・C型ウイルス性肝炎の比較表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>A型・B型・C型ウイルス性肝炎の比較表</title><rect width="560" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="172" height="280" rx="12" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="98" y="46" font-size="21" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >A型肝炎</text><line x1="26" y1="60" x2="170" y2="60" stroke="#0b5ea8" stroke-width="1.5"/><text x="98" y="86" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >うつり方</text><text x="98" y="112" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >食べ物・水（経口）</text><text x="98" y="156" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >慢性化</text><text x="98" y="182" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >慢性化しない</text><text x="98" y="226" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >覚える点</text><text x="98" y="252" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >―</text><rect x="194" y="12" width="172" height="280" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="280" y="46" font-size="21" fill="#cf2634" font-weight="bold" text-anchor="middle" >B型肝炎</text><line x1="208" y1="60" x2="352" y2="60" stroke="#cf2634" stroke-width="1.5"/><text x="280" y="86" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >うつり方</text><text x="280" y="112" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >血液・体液</text><text x="280" y="156" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >慢性化</text><text x="280" y="182" font-size="14" fill="#142638" font-weight="bold" text-anchor="middle" >慢性化することがある</text><text x="280" y="226" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >覚える点</text><text x="280" y="252" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >劇症化しやすい</text><rect x="376" y="12" width="172" height="280" rx="12" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="462" y="46" font-size="21" fill="#2e8b57" font-weight="bold" text-anchor="middle" >C型肝炎</text><line x1="390" y1="60" x2="534" y2="60" stroke="#2e8b57" stroke-width="1.5"/><text x="462" y="86" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >うつり方</text><text x="462" y="112" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >血液</text><text x="462" y="156" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >慢性化</text><text x="462" y="182" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >慢性化しやすい</text><text x="462" y="226" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >覚える点</text><text x="462" y="252" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="middle" >肝細胞癌の原因で最多</text><rect x="12" y="304" width="536" height="28" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="324" font-size="15" fill="#142638" font-weight="bold" text-anchor="start" >A型は食べ物から。B型・C型は血液から。</text></svg>