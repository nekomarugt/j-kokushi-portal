<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 387" width="560" height="387" role="img" aria-label="急性糸球体腎炎とネフローゼ症候群の比較" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>急性糸球体腎炎とネフローゼ症候群の比較</title><rect width="560" height="387" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="112" y="10" width="216" height="36" rx="8" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="220.0" y="34" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >急性糸球体腎炎</text><rect x="332" y="10" width="216" height="36" rx="8" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="440.0" y="34" font-size="16" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >ネフローゼ症候群</text><rect x="10" y="52" width="540" height="54.2" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="84.14" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="start" >原因</text><text x="220.0" y="75.04" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="middle" >A群溶連菌感染</text><text x="220.0" y="93.24000000000001" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="middle" >の1〜3週後</text><text x="440.0" y="75.04" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >微小変化型</text><text x="440.0" y="93.24000000000001" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >膜性腎症・糖尿病など</text><rect x="10" y="110.2" width="540" height="54.2" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="142.34" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="start" >好発</text><text x="220.0" y="133.24" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="middle" >小児</text><text x="220.0" y="151.44" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="middle" >（3〜12歳男児）</text><text x="440.0" y="133.24" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >小児は微小変化型</text><text x="440.0" y="151.44" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >成人は膜性腎症も</text><rect x="10" y="168.4" width="540" height="72.4" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="209.64000000000001" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="start" >主徴</text><text x="220.0" y="200.54000000000002" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="middle" >血尿・蛋白尿</text><text x="220.0" y="218.74" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="middle" >浮腫・高血圧・乏尿</text><text x="440.0" y="191.44000000000003" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >大量の蛋白尿</text><text x="440.0" y="209.64000000000001" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >低蛋白血症・浮腫</text><text x="440.0" y="227.84000000000003" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >脂質異常症</text><rect x="10" y="244.8" width="540" height="54.2" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="276.94000000000005" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="start" >検査</text><text x="220.0" y="267.84000000000003" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="middle" >ASO上昇</text><text x="220.0" y="286.04" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="middle" >BUN・Cr上昇</text><text x="440.0" y="267.84000000000003" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >低アルブミン血症</text><text x="440.0" y="286.04" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >高コレステロール血症</text><rect x="10" y="313.0" width="540" height="64" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="338.0" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="start" >腎炎＝“炎症で血が漏れる”（血尿・高血圧が主役）</text><text x="22" y="363.0" font-size="14.5" fill="#0b5ea8" font-weight="bold" text-anchor="start" >ネフローゼ＝“蛋白が漏れる”（蛋白↓で浮腫）</text></svg>