" >C7</text><rect x="331" y="14" width="24" height="30" rx="5" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="343.0" y="34" font-size="12.5" fill="#073b6a" font-weight="bold" text-anchor="middle" >C8</text><rect x="358" y="14" width="24" height="30" rx="5" fill="#fff" stroke="#fff" stroke-width="1.5" /><text x="370.0" y="34" font-size="12.5" fill="#073b6a" font-weight="bold" text-anchor="middle" >…</text><rect x="385" y="14" width="24" height="30" rx="5" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="397.0" y="34" font-size="12.5" fill="#073b6a" font-weight="bold" text-anchor="middle" >L2</text><rect x="412" y="14" width="24" height="30" rx="5" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="424.0" y="34" font-size="12.5" fill="#073b6a" font-weight="bold" text-anchor="middle" >L3</text><rect x="439" y="14" width="24" height="30" rx="5" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="451.0" y="34" font-size="12.5" fill="#073b6a" font-weight="bold" text-anchor="middle" >L4</text><rect x="466" y="14" width="24" height="30" rx="5" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="478.0" y="34" font-size="12.5" fill="#073b6a" font-weight="bold" text-anchor="middle" >L5</text><rect x="493" y="14" width="24" height="30" rx="5" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="505.0" y="34" font-size="12.5" fill="#073b6a" font-weight="bold" text-anchor="middle" >S1</text><rect x="520" y="14" width="24" height="30" rx="5" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="532.0" y="34" font-size="12.5" fill="#073b6a" font-weight="bold" text-anchor="middle" >S2</text><rect x="10" y="56" width="540" height="42" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="75" font-size="15.5" fill="#073b6a" font-weight="bold" text-anchor="start" >下顎反射</text><text x="20" y="93" font-size="12.5" fill="#607487" font-weight="normal" text-anchor="start" >三叉神経（橋）</text><text x=