text x="20" y="333" font-size="12.5" fill="#607487" font-weight="normal" text-anchor="start" >脛骨神経</text><rect x="495" y="307" width="47" height="20" rx="10" fill="#2e8b57" stroke="#2e8b57" stroke-width="1" /><text x="14" y="356" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="start" >ヘルニア：L3/4 → 膝蓋腱反射↓　L5/S1 → アキレス腱反射↓</text><rect x="10" y="372" width="266" height="138" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="22" y="398" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >亢進する</text><text x="22" y="421.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >上位運動ニューロン障害</text><text x="22" y="445.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >（錐体路障害）</text><text x="22" y="469.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >＋病的反射が出る</text><rect x="284" y="372" width="266" height="138" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="296" y="398" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="start" >減弱・消失する</text><text x="296" y="421.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >脊髄前角障害（ポリオ）</text><text x="296" y="445.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >後索障害（脊髄癆）</text><text x="296" y="469.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >末梢神経障害</text></svg>