<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 376" width="560" height="376" role="img" aria-label="皮膚の色調の変化：蒼白・チアノーゼ・黄疸・潮紅" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>皮膚の色調の変化：蒼白・チアノーゼ・黄疸・潮紅</title><rect width="560" height="376" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="10" y="10" width="268" height="124" rx="12" fill="#fff" stroke="#9aa9b8" stroke-width="2" /><circle cx="40" cy="40" r="16" fill="#f1f1ec" stroke="#9aa9b8" stroke-width="2"/><text x="66" y="47" font-size="20" fill="#142638" font-weight="bold" text-anchor="start" >蒼白</text><text x="24" y="82" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >高度の貧血・ショック</text><text x="24" y="108" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >眼瞼結膜・口腔粘膜・爪も白い</text><rect x="282" y="10" width="268" height="176" rx="12" fill="#fff" stroke="#6a4fb3" stroke-width="2" /><circle cx="312" cy="40" r="16" fill="#6b5b9a" stroke="#6a4fb3" stroke-width="2"/><text x="338" y="47" font-size="20" fill="#6a4fb3" font-weight="bold" text-anchor="start" >チアノーゼ</text><text x="296" y="82" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >暗紫赤色＝還元ヘモグロビン増加</text><text x="296" y="108" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >右→左シャント（ファロー四徴症）</text><text x="296" y="134" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >右心不全・末梢循環不全</text><text x="296" y="160" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >肺疾患・メトヘモグロビン血症</text><rect x="10" y="144" width="268" height="152" rx="12" fill="#fff" stroke="#b77a00" stroke-width="2" /><circle cx="40" cy="174" r="16" fill="#f2c230" stroke="#b77a00" stroke-width="2"/><text x="66" y="181" font-size="20" fill="#b77a00" font-weight="bold" text-anchor="start" >黄疸</text><text x="24" y="216" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >血中ビリルビンの上昇</text><text x="24" y="242" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >眼球結膜（白目）で気づきやすい</text><text x="24" y="268" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >肝・胆道疾患、溶血性貧血</text><rect x="282" y="196" width="268" height="100" rx="12" fill="#fff" stroke="#cf2634" stroke-width="2" /><circle cx="312" cy="226" r="16" fill="#e8837f" stroke="#cf2634" stroke-width="2"/><text x="338" y="233" font-size="20" fill="#cf2634" font-weight="bold" text-anchor="start" >潮紅</text><text x="296" y="268" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >発熱・精神的興奮</text><text x="296" y="294" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >多血症でもみられる</text><rect x="10" y="312" width="540" height="54" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="335" font-size="15.5" fill="#073b6a" font-weight="bold" text-anchor="start" >チアノーゼは“酸素を離したHb（還元Hb）”の色</text><text x="22" y="357" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >貧血が強いとHbそのものが少なく、出にくい</text></svg>