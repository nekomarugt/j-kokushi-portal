" y="46" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >聞こえ始め</text><text x="390" y="69.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >＝最高血圧</text><text x="390" y="91.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >（収縮期）</text><text x="390" y="113.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >スワン第1音</text><rect x="378" y="142" width="172" height="110" rx="10" fill="#e4effa" stroke="#073b6a" stroke-width="2" /><text x="390" y="168" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >聞こえなくなる</text><text x="390" y="191.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >＝最低血圧</text><text x="390" y="213.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >（拡張期）</text><text x="390" y="235.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >スワン第5音</text><line x1="194.22222222222223" y1="133.75" x2="378" y2="70" stroke="#cf2634" stroke-width="1.5"/><line x1="305.33333333333337" y1="215.0" x2="378" y2="190" stroke="#073b6a" stroke-width="1.5"/><rect x="10" y="306" width="540" height="60" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="22" y="331" font-size="15.5" fill="#b77a00" font-weight="bold" text-anchor="start" >触診法（橈骨動脈）：最高血圧だけ分かる</text><text x="22" y="355" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >聴診法より低めに出る・最低血圧は測れない</text><rect x="10" y="378" width="540" height="32" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="22" y="400" font-size="15.5" fill="#cf2634" font-weight="bold" text-anchor="start" >高血圧（WHO）</text><text x="180" y="400" font-size="15.5" fill="#142638" font-weight="bold" text-anchor="start" >140/90 mmHg 以上</text><rect x="10" y="416" width="540" height="32" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="22" y="438" font-size="15.5" fill="#2e8b57" font-weight="bold" text-anchor="start" >正常血圧</text><text x="180" y="438" font-size="15.5" fill="#142638" font-weight="bold" text-anchor="start" >130/85 mmHg 以下</text><rect x="10" y="454" width="540" height="32" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="22" y="476" font-size="15.5" fill="#0b5ea8" font-weight="bold" text-anchor="start" >低血圧</text><text x="180" y="476" font-size="15.5" fill="#142638" font-weight="bold" text-anchor="start" >最高血圧 男性100・女性90 以下</text></svg>