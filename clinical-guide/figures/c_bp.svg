<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" role="img" aria-label="聴診法による血圧測定と血圧の基準値" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>聴診法による血圧測定と血圧の基準値</title><rect width="560" height="500" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><line x1="64" y1="20" x2="64" y2="280" stroke="#607487" stroke-width="1.5"/><line x1="64" y1="280" x2="364" y2="280" stroke="#607487" stroke-width="1.5"/><text x="58" y="251.5" font-size="12.5" fill="#607487" font-weight="normal" text-anchor="end" >60</text><line x1="64" y1="247.5" x2="364" y2="247.5" stroke="#d8e4ee" stroke-width="1"/><text x="58" y="186.5" font-size="12.5" fill="#607487" font-weight="normal" text-anchor="end" >100</text><line x1="64" y1="182.5" x2="364" y2="182.5" stroke="#d8e4ee" stroke-width="1"/><text x="58" y="121.5" font-size="12.5" fill="#607487" font-weight="normal" text-ancho