<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 542" width="560" height="542" role="img" aria-label="異常歩行と障害部位の対応" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>異常歩行と障害部位の対応</title><rect width="560" height="542" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="10" y="10" width="266" height="86" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="22" y="37" font-size="17.5" fill="#cf2634" font-weight="bold" text-anchor="start" >分回し歩行（円弧歩行）</text><text x="22" y="62" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >片麻痺＝一側の錐体路障害</text><text x="22" y="84" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >例：脳血管障害</text><rect x="288" y="10" width="266" height="86" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="300" y="37" font-size="17.5" fill="#cf2634" font-weight="bold" text-anchor="start" >はさみ歩行</text><text x="300" y="62" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >痙性対麻痺＝両側の錐体路障害</text><text x="300" y="84" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >例：脳性小児麻痺</text><rect x="10" y="106" width="266" height="86" rx="10" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><text x="22" y="133" font-size="17.5" fill="#6a4fb3" font-weight="bold" text-anchor="start" >小刻み・突進歩行</text><text x="22" y="158" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >錐体外路障害</text><text x="22" y="180" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >例：パーキンソン病</text><rect x="288" y="106" width="266" height="86" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="300" y="133" font-size="17.5" fill="#0b5ea8" font-weight="bold" text-anchor="start" >酩酊歩行（千鳥足）</text><text x="300" y="158" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >小脳障害</text><text x="300" y="180" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >ロンベルグ試験は陰性</text><rect x="10" y="202" width="266" height="86" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="22" y="229" font-size="17.5" fill="#0b5ea8" font-weight="bold" text-anchor="start" >踵打ち歩行</text><text x="22" y="254" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >脊髄後索（深部感覚）障害</text><text x="22" y="276" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >ロンベルグ試験は陽性</text><rect x="288" y="202" width="266" height="86" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="300" y="229" font-size="17.5" fill="#2e8b57" font-weight="bold" text-anchor="start" >鶏歩（下垂足）</text><text x="300" y="254" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >下位運動ニューロン障害</text><text x="300" y="276" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >例：腓骨神経麻痺</text><rect x="10" y="298" width="266" height="86" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="22" y="325" font-size="17.5" fill="#2e8b57" font-weight="bold" text-anchor="start" >トレンデレンブルグ歩行</text><text x="22" y="350" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >中殿筋麻痺・先天性股関節脱臼</text><text x="22" y="372" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >患側で立つと健側骨盤が下がる</text><rect x="288" y="298" width="266" height="86" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="300" y="325" font-size="17.5" fill="#2e8b57" font-weight="bold" text-anchor="start" >アヒル歩行（動揺性）</text><text x="300" y="350" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >筋疾患</text><text x="300" y="372" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >例：進行性筋ジストロフィー</text><rect x="10" y="394" width="544" height="102" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="22" y="421" font-size="17.5" fill="#b77a00" font-weight="bold" text-anchor="start" >間欠性跛行：歩くと痛み、休むと再び歩ける</text><text x="22" y="447" font-size="15.5" fill="#142638" font-weight="normal" text-anchor="start" >血管性（閉塞性動脈硬化症・バージャー病）</text><text x="22" y="471" font-size="15.5" fill="#142638" font-weight="normal" text-anchor="start" >脊柱管狭窄症 → 体を前にかがめると楽になる</text><text x="22" y="491" font-size="13.5" fill="#607487" font-weight="normal" text-anchor="start" >（前かがみで変わらなければ血管性を考える）</text><rect x="14" y="510" width="14" height="14" rx="3" fill="#cf2634" stroke="#cf2634" stroke-width="1" /><text x="34" y="523" font-size="14" fill="#607487" font-weight="normal" text-anchor="start" >錐体路</text><rect x="110" y="510" width="14" height="14" rx="3" fill="#6a4fb3" stroke="#6a4fb3" stroke-width="1" /><text x="130" y="523" font-size="14" fill="#607487" font-weight="normal" text-anchor="start" >錐体外路</text><rect x="220" y="510" width="14" height="14" rx="3" fill="#0b5ea8" stroke="#0b5ea8" stroke-width="1" /><text x="240" y="523" font-size="14" fill="#607487" font-weight="normal" text-anchor="start" >小脳・感覚</text><rect x="346" y="510" width="14" height="14" rx="3" fill="#2e8b57" stroke="#2e8b57" stroke-width="1" /><text x="366" y="523" font-size="14" fill="#607487" font-weight="normal" text-anchor="start" >末梢神経・筋・関節</text></svg>