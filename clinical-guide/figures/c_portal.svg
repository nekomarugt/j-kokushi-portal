<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="肝硬変による門脈圧亢進と側副血行路の症状" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>肝硬変による門脈圧亢進と側副血行路の症状</title><rect width="560" height="470" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="14" y="14" width="190" height="60" rx="10" fill="#fdebdc" stroke="#c2570c" stroke-width="2"/><text x="109.0" y="41.0" font-size="19" fill="#c2570c" font-weight="bold" text-anchor="middle" >肝硬変</text><text x="109.0" y="58.5" font-size="12.5" fill="#142638" font-weight="normal" text-anchor="middle" >肝臓が硬く血が通りにくい</text><line x1="208" y1="44" x2="250" y2="44" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><rect x="254" y="14" width="292" height="60" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="400.0" y="41.0" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >門脈圧亢進</text><text x="400.0" y="58.5" font-size="12.5" fill="#142638" font-weight="normal" text-anchor="middle" >腸・脾臓からの血が肝臓へ入れない</text><line x1="400" y1="76" x2="400" y2="110" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><text x="400" y="128" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="middle" >迂回路（側副血行路）が太くなる・うっ滞する</text><rect x="10" y="146" width="266" height="92" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="22" y="172" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >食道静脈瘤</text><text x="22" y="195.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >食道下端の静脈が拡張</text><text x="22" y="218.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >破裂→大量吐血</text><rect x="284" y="146" width="266" height="92" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="296" y="172" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="start" >腹壁静脈怒張</text><text x="296" y="195.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >臍の周りの静脈</text><text x="296" y="218.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >＝メズサの頭</text><rect x="10" y="246" width="266" height="92" rx="10" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><text x="22" y="272" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="start" >脾腫</text><text x="22" y="295.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >脾臓に血がたまる</text><text x="22" y="318.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >→ 血球減少</text><rect x="284" y="246" width="266" height="92" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="296" y="272" font-size="17" fill="#2e8b57" font-weight="bold" text-anchor="start" >腹水</text><text x="296" y="295.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >腹腔に水がたまる</text><text x="296" y="318.2" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >（漏出性）</text><rect x="10" y="356" width="540" height="104" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="382" font-size="15.5" fill="#073b6a" font-weight="bold" text-anchor="start" >門脈＝腸・脾臓の静脈血を肝臓へ運ぶ血管</text><text x="22" y="408" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >肝臓で“渋滞”すると、手前の静脈があふれて</text><text x="22" y="432" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >食道・腹壁・直腸（痔核）などの細い静脈へ回り込む</text><text x="22" y="454" font-size="13" fill="#607487" font-weight="normal" text-anchor="start" >食道静脈瘤はS・Bチューブで圧迫止血</text></svg>