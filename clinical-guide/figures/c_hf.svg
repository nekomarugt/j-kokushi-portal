<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="左心不全と右心不全：血液がたまる場所の違い" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>左心不全と右心不全：血液がたまる場所の違い</title><rect width="560" height="470" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="190" y="12" width="180" height="56" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2"/><text x="280.0" y="37.0" font-size="20" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >肺</text><text x="280.0" y="55.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >肺循環</text><rect x="190" y="250" width="180" height="56" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="280.0" y="275.0" font-size="20" fill="#2e8b57" font-weight="bold" text-anchor="middle" >全身</text><text x="280.0" y="293.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >体循環</text><rect x="190" y="120" width="88" height="80" rx="10" fill="#e9eefc" stroke="#0b5ea8" stroke-width="2.5" /><text x="234" y="156" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >右心</text><text x="234" y="180" font-size="12.5" fill="#607487" font-weight="normal" text-anchor="middle" >（右室）</text><rect x="282" y="120" width="88" height="80" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2.5" /><text x="326" y="156" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >左心</text><text x="326" y="180" font-size="12.5" fill="#607487" font-weight="normal" text-anchor="middle" >（左室）</text><polyline points="214.0,250.0 214.0,204.0" fill="none" stroke="#2e8b57" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahg)"/><polyline points="214.0,118.0 214.0,72.0" fill="none" stroke="#0b5ea8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><polyline points="346.0,70.0 346.0,116.0" fill="none" stroke="#cf2634" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahr)"/><polyline points="346.0,204.0 346.0,248.0" fill="none" stroke="#cf2634" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahr)"/><text x="200" y="232" font-size="12" fill="#607487" font-weight="normal" text-anchor="end" >静脈血</text><text x="360" y="232" font-size="12" fill="#607487" font-weight="normal" text-anchor="start" >動脈血</text><path d="M386,150 Q430,110 384,48" fill="none" stroke="#cf2634" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahr)" stroke-dasharray="7 5"/><path d="M174,170 Q130,220 174,284" fill="none" stroke="#0b5ea8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)" stroke-dasharray="7 5"/><text x="420" y="106" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="start" >うっ血</text><text x="88" y="228" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="start" >うっ血</text><rect x="10" y="12" width="170" height="170" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="22" y="38" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="start" >右心不全</text><text x="22" y="60.400000000000006" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >体の静脈にたまる</text><text x="22" y="82.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >頸静脈怒張</text><text x="22" y="104.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >肝腫大</text><text x="22" y="126.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >下肢浮腫・腹水</text><text x="22" y="148.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >食欲不振</text><rect x="386" y="180" width="164" height="176" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="398" y="206" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >左心不全</text><text x="398" y="228.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >肺にたまる</text><text x="398" y="249.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >肺うっ血</text><text x="398" y="270.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >労作性呼吸困難</text><text x="398" y="291.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >起坐呼吸</text><text x="398" y="312.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >発作性夜間呼吸困難</text><text x="398" y="333.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >（心臓喘息）</text><rect x="10" y="372" width="540" height="88" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="397" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="start" >“ポンプの手前”に血がたまる</text><text x="22" y="422" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >左心の手前＝肺、右心の手前＝全身の静脈</text><text x="22" y="446" font-size="13.5" fill="#607487" font-weight="normal" text-anchor="start" >進行すると左右両方の症状がそろう（左心不全→右心不全）</text></svg>