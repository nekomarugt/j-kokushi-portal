fbf3e8" stroke="#2e8b57" stroke-width="2.2"/><circle cx="156" cy="84" r="9" fill="#fbf3e8" stroke="#2e8b57" stroke-width="2.2"/><circle cx="174" cy="94" r="8" fill="#fbf3e8" stroke="#2e8b57" stroke-width="2.2"/><path d="M100,290 Q78,230 90,160 Q110,110 160,104" fill="none" stroke="#c2570c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aho)" stroke-dasharray="7 5"/><text x="200" y="170" font-size="13" fill="#c2570c" font-weight="bold" text-anchor="start" >足底の外側</text><text x="200" y="188" font-size="13" fill="#c2570c" font-weight="bold" text-anchor="start" >をこする</text><text x="22" y="328" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="start" >足趾はすべて底屈</text><rect x="284" y="10" width="266" height="330" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2" /><text x="296" y="36" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >バビンスキー反射 陽性</text><path d="M384,300 Q344,240 354,150 Q364,100 414,95 Q464,100 462,150 Q454,220 446,300 Q414,326 384,300 Z" fill="#fbf3e8" stroke="#cf2634" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="360" cy="60" r="14" fill="#fbf3e8" stroke="#cf2634" stroke-width="2.2"/><circle cx="397" cy="82" r="10" fill="#fbf3e8" stroke="#cf2634" stroke-width="2.2"/><circle cx="428" cy="82" r="10" fill="#fbf3e8" stroke="#cf2634" stroke-width="2.2"/><circle cx="457" cy="88" r="9" fill="#fbf3e8" stroke="#cf2634" stroke-width="2.2"/><circle cx="484" cy="98" r="8" fill="#fbf3e8" stroke="#cf2634" stroke-width="2.2"/><path d="M374,290 Q352,230 364,160 Q384,110 434,104" fill="none" stroke="#c2570c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aho)" stroke-dasharray="7 5"/><text x="474" y="170" font-size="13" fill="#c2570c" font-weight="bold" text-anchor="start" >足底の外側</text><text x="474" y="188" font-size="13" fill="#c2570c" font-weight="bold" text-anchor="start" >をこする</text><text x="296" y="328" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="start" >母趾が背屈、他の趾は開く（開扇）</text><line x1="344" y1="110" x2="344" y2="64" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><text x="14" y="368" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="start" >陽性＝錐体路障害のサイン（健常な乳児でもみられる）</text><text x="14" y="392" font-size="13.5" fill="#607487" font-weight="normal" text-anchor="start" >同じ“母趾背屈”を見る：チャドック・オッペンハイム・ゴードン</text></svg>