<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="急性腎障害の3分類：腎前性・腎性・腎後性" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>急性腎障害の3分類：腎前性・腎性・腎後性</title><rect width="560" height="420" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="20" y="150" width="120" height="70" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="80.0" y="182.0" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >血流</text><text x="80.0" y="200.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >心臓・血管</text><rect x="220" y="150" width="120" height="70" rx="10" fill="#fdebdc" stroke="#c2570c" stroke-width="2"/><text x="280.0" y="182.0" font-size="18" fill="#c2570c" font-weight="bold" text-anchor="middle" >腎臓</text><text x="280.0" y="200.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >糸球体・尿細管</text><rect x="420" y="150" width="120" height="70" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2"/><text x="480.0" y="182.0" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >尿路</text><text x="480.0" y="200.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >尿管・膀胱</text><line x1="142" y1="185" x2="216" y2="185" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><line x1="342" y1="185" x2="416" y2="185" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><text x="80" y="30" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >腎前性</text><text x="80" y="58" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >腎血流量の減少</text><text x="80" y="80" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >脱水・出血・心不全</text><line x1="80" y1="110" x2="80" y2="144" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><text x="280" y="30" font-size="18" fill="#c2570c" font-weight="bold" text-anchor="middle" >腎性</text><text x="280" y="58" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >腎実質の障害</text><text x="280" y="80" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >糸球体・尿細管</text><line x1="280" y1="110" x2="280" y2="144" stroke="#c2570c" stroke-width="3" marker-end="url(#aho)"/><text x="480" y="30" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >腎後性</text><text x="480" y="58" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >両側の尿路閉塞</text><text x="480" y="80" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >結石・前立腺肥大</text><line x1="480" y1="110" x2="480" y2="144" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)"/><rect x="10" y="244" width="540" height="166" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="270" font-size="15.5" fill="#073b6a" font-weight="bold" text-anchor="start" >経過：乏尿期 → 利尿期 → 回復期</text><text x="22" y="296" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="start" >乏尿＝1日400mL以下　無尿＝1日100mL以下</text><text x="22" y="322" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >乏尿期：BUN・クレアチニン・K↑、代謝性アシドーシス</text><text x="22" y="346" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >利尿期：尿量増加 → 脱水・Na・K低下に注意</text><text x="22" y="374" font-size="14" fill="#607487" font-weight="normal" text-anchor="start" >腎前性は早く治療すれば回復、腎後性は閉塞を解除</text><text x="22" y="396" font-size="13" fill="#607487" font-weight="normal" text-anchor="start" >（慢性腎臓病＝腎障害やGFR低下が3か月以上）</text></svg>