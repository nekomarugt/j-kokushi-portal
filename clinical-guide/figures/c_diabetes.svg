<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 513" width="560" height="513" role="img" aria-label="糖尿病のⅠ型とⅡ型の比較と三大合併症" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>糖尿病のⅠ型とⅡ型の比較と三大合併症</title><rect width="560" height="513" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="122" y="10" width="211" height="36" rx="8" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="227.5" y="34" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >Ⅰ型</text><rect x="337" y="10" width="211" height="36" rx="8" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="442.5" y="34" font-size="16" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >Ⅱ型</text><rect x="10" y="52" width="540" height="56.85" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="85.645" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >原因</text><text x="227.5" y="76.22" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >自己免疫で</text><text x="227.5" y="95.07" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >インスリンが出ない</text><text x="442.5" y="76.22" font-size="14.5" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >インスリン分泌↓</text><text x="442.5" y="95.07" font-size="14.5" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >＋効きが悪い</text><rect x="10" y="112.85" width="540" height="56.85" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="146.495" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >体型・年齢</text><text x="227.5" y="137.07" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >若年・非肥満</text><text x="227.5" y="155.92" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >に多い</text><text x="442.5" y="137.07" font-size="14.5" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >中年以降</text><text x="442.5" y="155.92" font-size="14.5" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >生活習慣</text><rect x="10" y="173.7" width="540" height="56.85" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="207.345" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >治療</text><text x="227.5" y="207.345" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >インスリン必須</text><text x="442.5" y="197.92" font-size="14.5" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >食事・運動</text><text x="442.5" y="216.76999999999998" font-size="14.5" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >＋薬</text><rect x="10" y="242.54999999999998" width="540" height="64" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="22" y="268.54999999999995" font-size="16" fill="#b77a00" font-weight="bold" text-anchor="start" >症状：口渇・多飲・多尿・体重減少</text><text x="22" y="292.54999999999995" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >診断の目安：HbA1c 6.5％以上（血糖値と組み合わせる）</text><text x="14" y="334.54999999999995" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="start" >三大合併症（細い血管の障害）＝「し・め・じ」</text><rect x="10" y="346.54999999999995" width="174" height="110" rx="10" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><circle cx="36" cy="374.54999999999995" r="17" fill="#6a4fb3" stroke="#6a4fb3" stroke-width="1"/><text x="36" y="381.54999999999995" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" >し</text><text x="62" y="381.54999999999995" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="start" >神経障害</text><text x="22" y="416.54999999999995" font-size="13" fill="#142638" font-weight="normal" text-anchor="start" >手袋靴下型のしびれ</text><text x="22" y="437.54999999999995" font-size="13" fill="#142638" font-weight="normal" text-anchor="start" >振動覚↓・起立性低血圧</text><rect x="192" y="346.54999999999995" width="174" height="110" rx="10" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><circle cx="218" cy="374.54999999999995" r="17" fill="#6a4fb3" stroke="#6a4fb3" stroke-width="1"/><text x="218" y="381.54999999999995" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" >め</text><text x="244" y="381.54999999999995" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="start" >網膜症</text><text x="204" y="416.54999999999995" font-size="13" fill="#142638" font-weight="normal" text-anchor="start" >視力低下</text><text x="204" y="437.54999999999995" font-size="13" fill="#142638" font-weight="normal" text-anchor="start" >（失明の原因にも）</text><rect x="374" y="346.54999999999995" width="174" height="110" rx="10" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><circle cx="400" cy="374.54999999999995" r="17" fill="#6a4fb3" stroke="#6a4fb3" stroke-width="1"/><text x="400" y="381.54999999999995" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" >じ</text><text x="426" y="381.54999999999995" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="start" >腎症</text><text x="386" y="416.54999999999995" font-size="13" fill="#142638" font-weight="normal" text-anchor="start" >蛋白尿 →</text><text x="386" y="437.54999999999995" font-size="13" fill="#142638" font-weight="normal" text-anchor="start" >ネフローゼ・透析</text><text x="14" y="476.54999999999995" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="start" >急性（糖尿病性昏睡）：ケトアシドーシス＝1型に多い</text><text x="14" y="498.54999999999995" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="start" >（アセトン臭・クスマウル呼吸）／高浸透圧高血糖＝2型に多い</text></svg>