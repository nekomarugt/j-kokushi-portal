<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="打診音の種類と胸腹部の位置" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>打診音の種類と胸腹部の位置</title><rect width="560" height="470" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><path d="M40,20 Q30,60 34,200 L34,380 Q140,410 246,380 L246,200 Q250,60 240,20 Z" fill="#fbf8ef" stroke="#607487" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M60,40 Q48,120 62,196 Q100,206 128,190 L128,52 Q100,34 60,40 Z" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M220,40 Q232,120 218,196 Q180,206 152,190 L152,52 Q180,34 220,40 Z" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M112,120 Q150,104 176,130 Q186,180 150,196 Q116,198 108,170 Z" fill="#f6cdd1" stroke="#cf2634" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M40,204 Q120,190 150,210 Q140,262 60,272 Q40,250 40,204 Z" fill="#f3d3bb" stroke="#c2570c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M162,212 Q220,196 238,214 Q238,262 190,268 Q160,250 162,212 Z" fill="#d6efe9" stroke="#1f7a6d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M60,288 Q140,276 222,292 Q226,350 140,362 Q60,352 60,288 Z" fill="#e5f5f1" stroke="#1f7a6d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="94" y="90" font-size="16" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >肺</text><text x="186" y="90" font-size="16" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >肺</text><text x="146" y="160" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >心</text><text x="88" y="240" font-size="16" fill="#c2570c" font-weight="bold" text-anchor="middle" >肝</text><text x="200" y="240" font-size="16" fill="#1f7a6d" font-weight="bold" text-anchor="middle" >胃</text><text x="142" y="326" font-size="16" fill="#1f7a6d" font-weight="bold" text-anchor="middle" >腸</text><text x="40" y="404" font-size="14" fill="#607487" font-weight="normal" text-anchor="start" >右</text><text x="240" y="404" font-size="14" fill="#607487" font-weight="normal" text-anchor="end" >左</text><text x="140" y="404" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >（患者の正面）</text><rect x="264" y="14" width="286" height="80" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="276" y="41" font-size="19" fill="#0b5ea8" font-weight="bold" text-anchor="start" >清音</text><text x="324.0" y="41" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >正常な肺</text><text x="276" y="68" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >空気と組織がほどよく混在</text><rect x="264" y="104" width="286" height="102" rx="10" fill="#e5f5f1" stroke="#1f7a6d" stroke-width="2" /><text x="276" y="131" font-size="19" fill="#1f7a6d" font-weight="bold" text-anchor="start" >鼓音・過共鳴</text><text x="400.0" y="131" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >胃・腸（空気が多い）</text><text x="276" y="158" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >イレウスで鼓音増強</text><text x="276" y="180" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >肺気腫・気胸で過共鳴</text><rect x="264" y="216" width="286" height="102" rx="10" fill="#fdebdc" stroke="#c2570c" stroke-width="2" /><text x="276" y="243" font-size="19" fill="#c2570c" font-weight="bold" text-anchor="start" >濁音</text><text x="324.0" y="243" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >心・肝（実質臓器）</text><text x="276" y="270" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >肺炎・無気肺・胸水</text><text x="276" y="292" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >腹水・肝腫大</text><defs><linearGradient id="gpc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f7a6d"/><stop offset="0.5" stop-color="#0b5ea8"/><stop offset="1" stop-color="#c2570c"/></linearGradient></defs><rect x="264" y="318" width="286" height="14" rx="7" fill="url(#gpc)"/><text x="264" y="352" font-size="13.5" fill="#1f7a6d" font-weight="bold" text-anchor="start" >空気が多い</text><text x="550" y="352" font-size="13.5" fill="#c2570c" font-weight="bold" text-anchor="end" >空気が少ない・水</text><rect x="264" y="372" width="286" height="88" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="276" y="396" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="start" >心濁音界</text><text x="276" y="418" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >右界：胸骨右縁　上界：第3肋骨</text><text x="276" y="440" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >左界：左鎖骨中線のやや内側</text><text x="14" y="440" font-size="14.5" fill="#142638" font-weight="bold" text-anchor="start" >肺気腫：鼓音、肺肝境界は低下</text></svg>