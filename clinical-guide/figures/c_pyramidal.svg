<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 449" width="560" height="449" role="img" aria-label="錐体路障害と錐体外路障害の比較" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>錐体路障害と錐体外路障害の比較</title><rect width="560" height="449" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="122" y="10" width="211" height="36" rx="8" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="227.5" y="34" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >錐体路障害</text><rect x="337" y="10" width="211" height="36" rx="8" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><text x="442.5" y="34" font-size="16" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >錐体外路障害</text><rect x="10" y="52" width="540" height="54.85" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="84.645" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >障害部位</text><text x="227.5" y="75.22" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >大脳皮質〜内包</text><text x="227.5" y="94.07" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >〜脊髄側索</text><text x="442.5" y="75.22" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >大脳基底核</text><text x="442.5" y="94.07" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >（黒質・線条体）</text><rect x="10" y="110.85" width="540" height="54.85" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="143.495" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >運動</text><text x="227.5" y="143.495" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >麻痺</text><text x="442.5" y="134.07" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >不随意運動</text><text x="442.5" y="152.92" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >（振戦など）</text><rect x="10" y="169.7" width="540" height="54.85" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="202.345" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >筋緊張</text><text x="227.5" y="192.92" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >痙縮</text><text x="227.5" y="211.76999999999998" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >折りたたみナイフ</text><text x="442.5" y="192.92" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >固縮</text><text x="442.5" y="211.76999999999998" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >鉛管・歯車</text><rect x="10" y="228.54999999999998" width="540" height="36.0" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="251.76999999999998" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >腱反射</text><text x="227.5" y="251.76999999999998" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >亢進</text><text x="442.5" y="251.76999999999998" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >正常</text><rect x="10" y="268.54999999999995" width="540" height="36.0" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="291.77" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >病的反射</text><text x="227.5" y="291.77" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >陽性</text><text x="442.5" y="291.77" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >なし</text><rect x="10" y="308.54999999999995" width="540" height="54.85" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="341.195" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >歩行</text><text x="227.5" y="331.77" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >はさみ・</text><text x="227.5" y="350.62" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >分回し歩行</text><text x="442.5" y="331.77" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >小刻み・</text><text x="442.5" y="350.62" font-size="14.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >突進歩行</text><rect x="10" y="377.4" width="540" height="62" rx="10" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><text x="22" y="402.4" font-size="15.5" fill="#6a4fb3" font-weight="bold" text-anchor="start" >パーキンソン病：黒質のドパミン↓</text><text x="22" y="426.4" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >安静時振戦・筋固縮・無動・前屈姿勢・仮面様顔貌</text></svg>