<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 438" width="560" height="438" role="img" aria-label="出血傾向の3つの原因：血管壁・血小板・凝固因子" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>出血傾向の3つの原因：血管壁・血小板・凝固因子</title><rect width="560" height="438" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="10" y="10" width="174" height="330" rx="10" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><text x="97" y="38" font-size="16.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >血管壁の異常</text><text x="20" y="70" font-size="13" fill="#607487" font-weight="bold" text-anchor="start" >代表的な疾患</text><text x="20" y="94" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >アレルギー性紫斑病</text><text x="20" y="116" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >壊血病</text><text x="20" y="138" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >（ビタミンC欠乏）</text><line x1="20" y1="184" x2="174" y2="184" stroke="#6a4fb3" stroke-width="1.5" stroke-dasharray="4 4"/><text x="20" y="208" font-size="13" fill="#607487" font-weight="bold" text-anchor="start" >検査・出血の特徴</text><text x="20" y="234" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="start" >血小板・凝固は正常</text><rect x="192" y="10" width="174" height="330" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="279" y="38" font-size="16.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >血小板の異常</text><text x="202" y="70" font-size="13" fill="#607487" font-weight="bold" text-anchor="start" >代表的な疾患</text><text x="202" y="94" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >ITP（免疫性</text><text x="202" y="116" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >　血小板減少症）</text><text x="202" y="138" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >再生不良性貧血</text><text x="202" y="160" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >白血病</text><line x1="202" y1="184" x2="356" y2="184" stroke="#cf2634" stroke-width="1.5" stroke-dasharray="4 4"/><text x="202" y="208" font-size="13" fill="#607487" font-weight="bold" text-anchor="start" >検査・出血の特徴</text><text x="202" y="234" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="start" >血小板数↓</text><text x="202" y="260" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="start" >出血時間の延長</text><text x="202" y="286" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="start" >点状出血・紫斑</text><rect x="374" y="10" width="174" height="330" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="461" y="38" font-size="16.5" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >凝固因子の異常</text><text x="384" y="70" font-size="13" fill="#607487" font-weight="bold" text-anchor="start" >代表的な疾患</text><text x="384" y="94" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >血友病</text><text x="384" y="116" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >（A＝Ⅷ・B＝Ⅸ因子）</text><text x="384" y="138" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >DIC・肝硬変</text><text x="384" y="160" font-size="13.5" fill="#142638" font-weight="bold" text-anchor="start" >ビタミンK欠乏</text><line x1="384" y1="184" x2="538" y2="184" stroke="#0b5ea8" stroke-width="1.5" stroke-dasharray="4 4"/><text x="384" y="208" font-size="13" fill="#607487" font-weight="bold" text-anchor="start" >検査・出血の特徴</text><text x="384" y="234" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="start" >APTT延長（血友病）</text><text x="384" y="260" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="start" >PT・血小板数・出血</text><text x="384" y="286" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="start" >時間は正常（血友病）</text><text x="384" y="312" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="start" >関節内・筋肉内血腫</text><rect x="10" y="352" width="540" height="76" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="377" font-size="15.5" fill="#073b6a" font-weight="bold" text-anchor="start" >止血の順番で考える</text><text x="22" y="402" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >血管が縮む → 血小板が“ふた” → 凝固因子で固める</text><text x="22" y="422" font-size="13.5" fill="#607487" font-weight="normal" text-anchor="start" >どの段階が壊れたかで、出方と検査の異常が変わる</text></svg>