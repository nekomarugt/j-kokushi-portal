<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" role="img" aria-label="意識障害の段階：清明から昏睡まで" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>意識障害の段階：清明から昏睡まで</title><rect width="560" height="500" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><defs><linearGradient id="gcons" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e8b57"/><stop offset="0.5" stop-color="#b77a00"/><stop offset="1" stop-color="#cf2634"/></linearGradient></defs><rect x="12" y="12" width="16" height="354" rx="8" fill="url(#gcons)"/><rect x="40" y="12" width="124" height="52" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="102.0" y="45.2" font-size="20" fill="#2e8b57" font-weight="bold" text-anchor="middle" >清明</text><text x="178" y="44" font-size="16.5" fill="#142638" font-weight="normal" text-anchor="start" >意識がしっかりしている</text><rect x="40" y="72" width="124" height="52" rx="10" fill="#eef6e4" stroke="#2e8b57" stroke-width="2"/><text x="102.0" y="105.2" font-size="20" fill="#2e8b57" font-weight="bold" text-anchor="middle" >無欲状態</text><text x="178" y="104" font-size="16.5" fill="#142638" font-weight="normal" text-anchor="start" >意識はあるが、周囲に無関心でぼんやり</text><rect x="40" y="132" width="124" height="52" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="102.0" y="165.2" font-size="20" fill="#b77a00" font-weight="bold" text-anchor="middle" >傾眠</text><text x="178" y="153" font-size="16.5" fill="#142638" font-weight="normal" text-anchor="start" >軽い刺激で反応する</text><text x="178" y="175" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >（うとうと眠っているような状態）</text><rect x="40" y="192" width="124" height="52" rx="10" fill="#fdebdc" stroke="#c2570c" stroke-width="2"/><text x="102.0" y="225.2" font-size="20" fill="#c2570c" font-weight="bold" text-anchor="middle" >昏迷</text><text x="178" y="213" font-size="16.5" fill="#142638" font-weight="normal" text-anchor="start" >つねる等の強い刺激にのみ少し反応</text><text x="178" y="235" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >手足の自動運動はある</text><rect x="40" y="252" width="124" height="52" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="102.0" y="285.2" font-size="20" fill="#cf2634" font-weight="bold" text-anchor="middle" >半昏睡</text><text x="178" y="273" font-size="16.5" fill="#142638" font-weight="normal" text-anchor="start" >痛み刺激で簡単な手足の動き</text><text x="178" y="295" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >覚醒はしない</text><rect x="40" y="312" width="124" height="52" rx="10" fill="#f6d3d7" stroke="#cf2634" stroke-width="2"/><text x="102.0" y="345.2" font-size="20" fill="#cf2634" font-weight="bold" text-anchor="middle" >昏睡</text><text x="178" y="333" font-size="16.5" fill="#142638" font-weight="normal" text-anchor="start" >いかなる刺激にも反応しない</text><text x="178" y="355" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >失禁あり（意識の完全消失）</text><text x="20" y="384" font-size="15.5" fill="#607487" font-weight="bold" text-anchor="start" >↓ 下へいくほど刺激への反応が弱い（重い）</text><rect x="12" y="400" width="536" height="88" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="26" y="426" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="start" >段階とは別に覚える</text><text x="26" y="451" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >失神：一過性に、短時間だけ意識を失う</text><text x="26" y="476" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >せん妄：刺激に反応せず、不安・興奮して意味不明の言動</text></svg>