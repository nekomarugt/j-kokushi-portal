<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" role="img" aria-label="腹部9区分と触診で確認する臓器" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>腹部9区分と触診で確認する臓器</title><rect width="560" height="500" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="20" y="20" width="172" height="120" rx="0" fill="#fdebdc" stroke="#607487" stroke-width="1.5" /><text x="106.0" y="46" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >右季肋部</text><text x="106.0" y="76" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >肝臓（右肋骨弓）</text><text x="106.0" y="98" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >胆嚢</text><rect x="192" y="20" width="172" height="120" rx="0" fill="#e4effa" stroke="#607487" stroke-width="1.5" /><text x="278.0" y="46" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >心窩部</text><text x="278.0" y="76" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >胃（通常触れない）</text><text x="278.0" y="98" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >膵：触知できない</text><rect x="364" y="20" width="172" height="120" rx="0" fill="#efeafb" stroke="#607487" stroke-width="1.5" /><text x="450.0" y="46" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >左季肋部</text><text x="450.0" y="76" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >脾腫で触れる</text><rect x="20" y="140" width="172" height="120" rx="0" fill="#e5f5ec" stroke="#607487" stroke-width="1.5" /><text x="106.0" y="166" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >右側腹部</text><text x="106.0" y="196" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >上行結腸</text><text x="106.0" y="218" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >腎（側腹部）</text><rect x="192" y="140" width="172" height="120" rx="0" fill="#fff4d6" stroke="#607487" stroke-width="1.5" /><text x="278.0" y="166" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >臍部</text><text x="278.0" y="196" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >小腸</text><text x="278.0" y="218" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >横行結腸</text><rect x="364" y="140" width="172" height="120" rx="0" fill="#e5f5ec" stroke="#607487" stroke-width="1.5" /><text x="450.0" y="166" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >左側腹部</text><text x="450.0" y="196" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >下行結腸</text><text x="450.0" y="218" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >腎（側腹部）</text><rect x="20" y="260" width="172" height="120" rx="0" fill="#fdecee" stroke="#607487" stroke-width="1.5" /><text x="106.0" y="286" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >右腸骨窩</text><text x="106.0" y="316" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >回盲部・虫垂</text><text x="106.0" y="338" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >（虫垂炎の圧痛）</text><rect x="192" y="260" width="172" height="120" rx="0" fill="#fff" stroke="#607487" stroke-width="1.5" /><text x="278.0" y="286" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >下腹部</text><text x="278.0" y="316" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >膀胱</text><rect x="364" y="260" width="172" height="120" rx="0" fill="#e5f5ec" stroke="#607487" stroke-width="1.5" /><text x="450.0" y="286" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >左腸骨窩</text><text x="450.0" y="316" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >S状結腸</text><text x="20" y="402" font-size="14" fill="#607487" font-weight="normal" text-anchor="start" >右</text><text x="536" y="402" font-size="14" fill="#607487" font-weight="normal" text-anchor="end" >左</text><text x="278.0" y="402" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >（患者の正面から見た腹部9区分）</text><rect x="10" y="410" width="540" height="80" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="435" font-size="15.5" fill="#073b6a" font-weight="bold" text-anchor="start" >腹痛の部位から考える</text><text x="22" y="459" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >心窩部：胃・十二指腸・膵・胆石、虫垂炎の初期</text><text x="22" y="481" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >右下腹部：虫垂炎・腸結核　左下腹部：大腸</text></svg>