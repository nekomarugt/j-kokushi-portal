<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-label="ビリルビン代謝の流れと黄疸の3分類" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>ビリルビン代謝の流れと黄疸の3分類</title><rect width="560" height="520" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="14" y="14" width="250" height="62" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="139.0" y="42.0" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >赤血球の破壊</text><text x="139.0" y="60.5" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >寿命約120日・脾臓などで</text><rect x="14" y="104" width="250" height="62" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="139.0" y="132.0" font-size="18" fill="#b77a00" font-weight="bold" text-anchor="middle" >間接ビリルビン</text><text x="139.0" y="150.5" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >非抱合型・水に溶けにくい</text><rect x="14" y="194" width="250" height="62" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="139.0" y="222.0" font-size="18" fill="#2e8b57" font-weight="bold" text-anchor="middle" >肝臓でグルクロン酸抱合</text><text x="139.0" y="240.5" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >肝細胞が水に溶ける形に</text><rect x="14" y="284" width="250" height="62" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="139.0" y="312.0" font-size="18" fill="#b77a00" font-weight="bold" text-anchor="middle" >直接ビリルビン</text><text x="139.0" y="330.5" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >抱合型・水に溶ける</text><rect x="14" y="374" width="250" height="62" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2"/><text x="139.0" y="402.0" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >胆汁 → 胆管 → 十二指腸</text><text x="139.0" y="420.5" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >腸で代謝され便の色に</text><line x1="139.0" y1="78" x2="139.0" y2="102" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><line x1="139.0" y1="168" x2="139.0" y2="192" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><line x1="139.0" y1="258" x2="139.0" y2="282" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><line x1="139.0" y1="348" x2="139.0" y2="372" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="290" y="40" width="258" height="86" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2" /><text x="302" y="65" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >① 溶血性（肝前性）</text><text x="302" y="91" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >間接ビリルビン↑</text><text x="302" y="115" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >例：溶血性貧血</text><line x1="290" y1="60" x2="268" y2="60" stroke="#cf2634" stroke-width="2" stroke-dasharray="5 4"/><circle cx="268" cy="60" r="5" fill="#cf2634" stroke="#cf2634" stroke-width="1"/><rect x="290" y="180" width="258" height="86" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2" /><text x="302" y="205" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >② 肝細胞性</text><text x="302" y="231" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >直接・間接とも↑</text><text x="302" y="255" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >例：肝炎・肝硬変</text><line x1="290" y1="200" x2="268" y2="225" stroke="#cf2634" stroke-width="2" stroke-dasharray="5 4"/><circle cx="268" cy="225" r="5" fill="#cf2634" stroke="#cf2634" stroke-width="1"/><rect x="290" y="340" width="258" height="110" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2" /><text x="302" y="365" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >③ 閉塞性（肝後性）</text><text x="302" y="391" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >直接ビリルビン↑</text><text x="302" y="415" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >例：胆石・胆管癌</text><text x="302" y="439" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >便が白っぽくなる</text><line x1="290" y1="360" x2="268" y2="405" stroke="#cf2634" stroke-width="2" stroke-dasharray="5 4"/><circle cx="268" cy="405" r="5" fill="#cf2634" stroke="#cf2634" stroke-width="1"/><rect x="10" y="460" width="540" height="50" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="482" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="start" >どこで流れが詰まる・あふれるかで黄疸を3つに分ける</text><text x="22" y="503" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >黄疸はまず眼球結膜（白目）で気づく</text></svg>