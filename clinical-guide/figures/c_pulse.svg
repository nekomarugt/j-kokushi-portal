<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 506" width="560" height="506" role="img" aria-label="脈拍数の目安と脈の性状（速脈・遅脈）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>脈拍数の目安と脈の性状（速脈・遅脈）</title><rect width="560" height="506" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="30.0" y="40" width="136.36363636363635" height="30" fill="#e4effa" stroke="#0b5ea8" stroke-width="2"/><rect x="166.36363636363635" y="40" width="181.81818181818184" height="30" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><rect x="348.1818181818182" y="40" width="181.8181818181818" height="30" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="98.18181818181817" y="61" font-size="16" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >徐脈</text><text x="257.27272727272725" y="61" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle" >正常（成人・安静時）</text><text x="439.0909090909091" y="61" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >頻脈</text><line x1="166.36363636363635" y1="32" x2="166.36363636363635" y2="78" stroke="#142638" stroke-width="2.5"/><text x="166.36363636363635" y="26" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >60</text><line x1="348.1818181818182" y1="32" x2="348.1818181818182" y2="78" stroke="#142638" stroke-width="2.5"/><text x="348.1818181818182" y="26" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >100</text><text x="30.0" y="26" font-size="12.5" fill="#607487" font-weight="normal" text-anchor="start" >回/分</text><text x="98.18181818181817" y="98" font-size="14" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >60未満</text><text x="439.0909090909091" y="98" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="middle" >100以上</text><text x="257.27272727272725" y="98" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >健常人の目安 65〜85</text><rect x="10" y="124" width="540" height="100" rx="10" fill="#fff" stroke="#2e8b57" stroke-width="2" /><text x="22" y="150" font-size="17" fill="#2e8b57" font-weight="bold" text-anchor="start" >正常</text><polyline points="200.0,212.0 214.0,168.0 244.0,212.0 270.0,212.0 270.0,212.0 284.0,168.0 314.0,212.0 340.0,212.0 340.0,212.0 354.0,168.0 384.0,212.0 410.0,212.0 410.0,212.0 424.0,168.0 454.0,212.0 480.0,212.0" fill="none" stroke="#2e8b57" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="10" y="232" width="540" height="100" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2" /><text x="22" y="258" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >速脈・大脈</text><text x="22" y="282" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="start" >急に大きく立ち上がり、急に下がる</text><text x="22" y="310" font-size="12.5" fill="#607487" font-weight="normal" text-anchor="start" >大動脈弁閉鎖不全・甲状腺機能亢進症・貧血・発熱</text><polyline points="318.0,32