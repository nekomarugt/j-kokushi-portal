<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" width="560" height="384" role="img" aria-label="気胸・肺気腫・胸水・無気肺・肺炎の打診と聴診所見" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>気胸・肺気腫・胸水・無気肺・肺炎の打診と聴診所見</title><rect width="560" height="384" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="112" y="10" width="126" height="36" rx="8" fill="#fdebdc" stroke="#c2570c" stroke-width="2" /><text x="175.0" y="34" font-size="16" fill="#c2570c" font-weight="bold" text-anchor="middle" >打診</text><rect x="242" y="10" width="136" height="36" rx="8" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="310.0" y="34" font-size="16" fill="#2e8b57" font-weight="bold" text-anchor="middle" >呼吸音</text><rect x="382" y="10" width="166" height="36" rx="8" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><text x="465.0" y="34" font-size="16" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >なぜ</text><rect x="10" y="52" width="540" height="40.0" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="77.4" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="start" >気胸</text><text x="175.0" y="77.4" font-size="15" fill="#c2570c" font-weight="bold" text-anchor="middle" >鼓音</text><text x="310.0" y="77.4" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle" >減弱・消失</text><text x="465.0" y="77.4" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >胸膜腔に空気</text><rect x="10" y="96.0" width="540" height="59.5" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="131.15" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="start" >肺気腫</text><text x="175.0" y="121.4" font-size="15" fill="#c2570c" font-weight="bold" text-anchor="middle" >鼓音</text><text x="175.0" y="140.9" font-size="15" fill="#c2570c" font-weight="bold" text-anchor="middle" >（過共鳴）</text><text x="310.0" y="121.4" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle" >減弱</text><text x="310.0" y="140.9" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle" >呼気延長</text><text x="465.0" y="121.4" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >肺胞破壊</text><text x="465.0" y="140.9" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >肺肝境界↓</text><rect x="10" y="159.5" width="540" height="40.0" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="184.9" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="start" >胸水</text><text x="175.0" y="184.9" font-size="15" fill="#c2570c" font-weight="bold" text-anchor="middle" >濁音</text><text x="310.0" y="184.9" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle" >減弱</text><text x="465.0" y="184.9" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >胸膜腔に液体</text><rect x="10" y="203.5" width="540" height="40.0" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="228.9" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="start" >無気肺</text><text x="175.0" y="228.9" font-size="15" fill="#c2570c" font-weight="bold" text-anchor="middle" >濁音</text><text x="310.0" y="228.9" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle" >減弱</text><text x="465.0" y="228.9" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >肺がつぶれる</text><rect x="10" y="247.5" width="540" height="40.0" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="272.9" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="start" >肺炎</text><text x="175.0" y="272.9" font-size="15" fill="#c2570c" font-weight="bold" text-anchor="middle" >濁音</text><text x="310.0" y="272.9" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle" >増強</text><text x="465.0" y="272.9" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >肺胞に滲出液</text><rect x="10" y="301.5" width="540" height="70" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="326.5" font-size="15.5" fill="#073b6a" font-weight="bold" text-anchor="start" >空気がたまる→鼓音、液体・固まる→濁音</text><text x="22" y="351.5" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >肺炎は固まった肺が音をよく伝えるので呼吸音↑</text></svg>