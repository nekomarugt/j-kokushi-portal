<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 438" width="560" height="438" role="img" aria-label="換気障害の分類：閉塞性・拘束性・混合性" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>換気障害の分類：閉塞性・拘束性・混合性</title><rect width="560" height="438" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="70" y="20" width="207.0" height="126.0" rx="0" fill="#fdecee" stroke="#d8e4ee" stroke-width="1" /><rect x="277.0" y="20" width="253.0" height="126.0" rx="0" fill="#e5f5ec" stroke="#d8e4ee" stroke-width="1" /><rect x="70" y="146.0" width="207.0" height="154.0" rx="0" fill="#efeafb" stroke="#d8e4ee" stroke-width="1" /><rect x="277.0" y="146.0" width="253.0" height="154.0" rx="0" fill="#e4effa" stroke="#d8e4ee" stroke-width="1" /><line x1="70" y1="300" x2="530" y2="300" stroke="#142638" stroke-width="2"/><line x1="70" y1="20" x2="70" y2="300" stroke="#142638" stroke-width="2"/><line x1="277.0" y1="20" x2="277.0" y2="300" stroke="#142638" stroke-width="2" stroke-dasharray="6 4"/><line x1="70" y1="146.0" x2="530" y2="146.0" stroke="#142638" stroke-width="2" stroke-dasharray="6 4"/><text x="277.0" y="322" font-size="14" fill="#142638" font-weight="bold" text-anchor="middle" >80％</text><text x="64" y="151.0" font-size="14" fill="#142638" font-weight="bold" text-anchor="end" >70％</text><text x="530" y="322" font-size="14" fill="#607487" font-weight="bold" text-anchor="end" >％肺活量 →</text><text x="10" y="34" font-size="14" fill="#607487" font-weight="bold" text-anchor="start" >1秒率</text><text x="10" y="52" font-size="14" fill="#607487" font-weight="bold" text-anchor="start" >↑</text><text x="173.5" y="70" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >拘束性</text><text x="173.5" y="98" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >肺がふくらまない</text><text x="173.5" y="120" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >肺線維症</text><text x="173.5" y="142" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >間質性肺炎</text><text x="403.5" y="70" font-size="19" fill="#2e8b57" font-weight="bold" text-anchor="middle" >正常</text><text x="173.5" y="190.0" font-size="19" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >混合性</text><text x="173.5" y="218.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >両方が低下</text><text x="403.5" y="190.0" font-size="19" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >閉塞性</text><text x="403.5" y="218.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >息を吐き出しにくい</text><text x="403.5" y="240.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >気管支喘息・COPD</text><text x="403.5" y="262.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >（肺気腫）</text><rect x="10" y="340" width="540" height="88" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="365" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="start" >1秒率＝最初の1秒で吐ける量÷努力肺活量</text><text x="22" y="390" font-size="14.5" fill="#0b5ea8" font-weight="bold" text-anchor="start" >閉塞性：気道が狭い → 呼気延長・1秒率↓</text><text x="22" y="414" font-size="14.5" fill="#cf2634" font-weight="bold" text-anchor="start" >拘束性：肺が硬い → 肺活量↓（1秒率は保たれる）</text></svg>