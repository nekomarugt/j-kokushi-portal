<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 385" width="560" height="385" role="img" aria-label="脳血栓・脳塞栓・ラクナ梗塞の比較" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>脳血栓・脳塞栓・ラクナ梗塞の比較</title><rect width="560" height="385" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2570c"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a4fb3"/></marker></defs><rect x="116" y="10" width="142" height="36" rx="8" fill="#fdebdc" stroke="#c2570c" stroke-width="2" /><text x="187.0" y="34" font-size="15" fill="#c2570c" font-weight="bold" text-anchor="middle" >脳血栓</text><rect x="262" y="10" width="142" height="36" rx="8" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="333.0" y="34" font-size="15" fill="#cf2634" font-weight="bold" text-anchor="middle" >脳塞栓</text><rect x="408" y="10" width="140" height="36" rx="8" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><text x="478.0" y="34" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >ラクナ梗塞</text><rect x="10" y="52" width="540" height="57.55" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="85.635" font-size="13.5" fill="#073b6a" font-weight="bold" text-anchor="start" >原因</text><text x="187.0" y="76.86" font-size="13.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >太い動脈の</text><text x="187.0" y="94.41" font-size="13.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >アテローム硬化</text><text x="333.0" y="76.86" font-size="13.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >心臓の血栓が</text><text x="333.0" y="94.41" font-size="13.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >飛んでくる</text><text x="478.0" y="76.86" font-size="13.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >細い穿通枝</text><text x="478.0" y="94.41" font-size="13.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >の閉塞</text><rect x="10" y="113.55" width="540" height="57.55" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="147.185" font-size="13.5" fill="#073b6a" font-weight="bold" text-anchor="start" >発症</text><text x="187.0" y="138.40999999999997" font-size="13.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >段階的・安静時</text><text x="187.0" y="155.95999999999998" font-size="13.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >TIAが先行</text><text x="333.0" y="138.40999999999997" font-size="13.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >突然・数分で</text><text x="333.0" y="155.95999999999998" font-size="13.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >症状が完成</text><text x="478.0" y="138.40999999999997" font-size="13.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >軽症</text><text x="478.0" y="155.95999999999998" font-size="13.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >（運動のみ等）</text><rect x="10" y="175.1" width="540" height="57.55" rx="6" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="208.735" font-size="13.5" fill="#073b6a" font-weight="bold" text-anchor="start" >代表的背景</text><text x="187.0" y="199.95999999999998" font-size="13.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >高血圧・糖尿病</text><text x="187.0" y="217.51" font-size="13.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >喫煙・脂質異常</text><text x="333.0" y="199.95999999999998" font-size="13.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >心房細動</text><text x="333.0" y="217.51" font-size="13.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >弁膜症</text><text x="478.0" y="208.735" font-size="13.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >高血圧</text><rect x="10" y="236.64999999999998" width="540" height="40.0" rx="6" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="20" y="261.51" font-size="13.5" fill="#073b6a" font-weight="bold" text-anchor="start" >再発予防</text><text x="187.0" y="261.51" font-size="13.5" fill="#c2570c" font-weight="bold" text-anchor="middle" >抗血小板薬</text><text x="333.0" y="261.51" font-size="13.5" fill="#cf2634" font-weight="bold" text-anchor="middle" >抗凝固薬</text><text x="478.0" y="261.51" font-size="13.5" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >抗血小板薬</text><rect x="10" y="290.65" width="540" height="84" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="315.65" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="start" >画像：まずCTで出血を除外</text><text x="22" y="340.65" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >早期の梗塞はMRI拡散強調画像で見つけやすい</text><text x="22" y="364.65" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="start" >TIA＝症状が消えても脳梗塞の重要な警告</text></svg>