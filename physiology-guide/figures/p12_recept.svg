<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 393" width="560" height="393" role="img" aria-label="水溶性ホルモンと脂溶性ホルモンの受容体の場所の比較表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>水溶性ホルモンと脂溶性ホルモンの受容体の場所の比較表</title><rect width="560" height="393" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="234.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >水に溶ける</text><text x="443.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >脂に溶ける</text><rect x="12" y="58" width="536" height="71" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="99.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >なかま</text><text x="234.0" y="86.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >ペプチドホルモン</text><text x="234.0" y="110.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >アドレナリン</text><text x="443.0" y="86.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >ステロイドホルモン</text><text x="443.0" y="110.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >甲状腺ホルモン</text><rect x="12" y="135" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="163.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >受容体</text><text x="234.0" y="163.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >細胞膜（表面）</text><text x="443.0" y="163.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >細胞の中</text><rect x="12" y="187" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="215.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >細胞膜</text><text x="234.0" y="215.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >通れない</text><text x="443.0" y="215.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >通り抜けられる</text><rect x="12" y="239" width="536" height="96" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="292.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >例</text><text x="234.0" y="280.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >インスリン</text><text x="234.0" y="304.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >グルカゴン</text><text x="443.0" y="268.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >コルチゾール</text><text x="443.0" y="292.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >アルドステロン</text><text x="443.0" y="316.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >性ホルモン</text><rect x="12" y="343" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="368" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >脂は膜（脂）を通れる。水に溶ける物は表面で受ける</text></svg>