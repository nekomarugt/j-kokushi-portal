<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="膵液と胆汁の違いの比較図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>膵液と胆汁の違いの比較図</title><rect width="560" height="330" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="262" height="306" rx="12" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><rect x="286" y="12" width="262" height="306" rx="12" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="143" y="46" font-size="24" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >膵液</text><text x="417" y="46" font-size="24" fill="#b77a00" font-weight="bold" text-anchor="middle" >胆汁</text><text x="143" y="96" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >膵臓でつくる</text><text x="143" y="132" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >消化酵素あり</text><text x="143" y="168" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >アミラーゼ・リパーゼ</text><text x="143" y="204" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >タンパク質分解酵素</text><text x="143" y="240" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >＋ 重炭酸</text><text x="143" y="276" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >酸を中和する</text><text x="417" y="96" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >肝臓でつくる</text><text x="417" y="132" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >胆嚢で濃くして貯める</text><text x="417" y="168" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >消化酵素はなし</text><text x="417" y="204" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >胆汁酸が脂肪を</text><text x="417" y="240" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >細かくする（乳化）</text><text x="417" y="276" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >十二指腸へ出る</text></svg>