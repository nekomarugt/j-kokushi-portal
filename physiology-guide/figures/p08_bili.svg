<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" width="560" height="540" role="img" aria-label="ヘモグロビンの分解産物ビリルビンが肝臓・胆汁・腸を通る流れの図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>ヘモグロビンの分解産物ビリルビンが肝臓・胆汁・腸を通る流れの図</title><rect width="560" height="540" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="14" width="536" height="68" rx="12" fill="#f3f8fc" stroke="#9aa9b8" stroke-width="2" /><text x="28" y="42" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="start" >古い赤血球</text><text x="28" y="68" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >脾臓などで壊れる</text><line x1="280" y1="84" x2="280" y2="104" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="106" width="536" height="68" rx="12" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="134" font-size="19" fill="#b77a00" font-weight="bold" text-anchor="start" >間接ビリルビン</text><text x="28" y="160" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >水にとけにくい。アルブミンと結合して血液で運ぶ</text><line x1="280" y1="176" x2="280" y2="196" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="198" width="536" height="68" rx="12" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="28" y="226" font-size="19" fill="#2e8b57" font-weight="bold" text-anchor="start" >肝臓で抱合</text><text x="28" y="252" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >水にとける形にする</text><line x1="280" y1="268" x2="280" y2="288" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="290" width="536" height="68" rx="12" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="28" y="318" font-size="19" fill="#0b5ea8" font-weight="bold" text-anchor="start" >直接ビリルビン</text><text x="28" y="344" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >胆汁に入って十二指腸へ</text><line x1="280" y1="360" x2="280" y2="380" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="12" y="382" width="536" height="68" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="28" y="410" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="start" >腸内細菌が変化</text><text x="28" y="436" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >ウロビリノゲンになり、大部分は便の色のもとに</text><rect x="12" y="478" width="536" height="52" rx="12" fill="#fff" stroke="#0b5ea8" stroke-width="2" stroke-dasharray="6 4"/><text x="28" y="510" font-size="16" fill="#0b5ea8" font-weight="bold" text-anchor="start" >腸肝循環：胆汁酸は回腸で再吸収され、肝臓へ戻って再利用される</text></svg>