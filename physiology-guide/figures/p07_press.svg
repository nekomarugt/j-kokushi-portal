<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="吸気と呼気での胸郭・肺胞内圧・胸膜腔内圧の変化の比較表" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>吸気と呼気での胸郭・肺胞内圧・胸膜腔内圧の変化の比較表</title><rect width="560" height="420" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="234.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >吸うとき</text><text x="443.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >はくとき（安静）</text><rect x="12" y="58" width="536" height="71" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="99.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >筋肉</text><text x="234.0" y="98.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >横隔膜・外肋間筋が縮む</text><text x="443.0" y="86.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >ゆるむだけ</text><text x="443.0" y="110.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >（肺の弾力で縮む）</text><rect x="12" y="135" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="163.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >胸郭</text><text x="234.0" y="163.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >広がる</text><text x="443.0" y="163.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >もとにもどる</text><rect x="12" y="187" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="215.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >肺胞内圧</text><text x="234.0" y="215.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >大気圧より低い</text><text x="443.0" y="215.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >大気圧より高い</text><rect x="12" y="239" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="267.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >空気</text><text x="234.0" y="267.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >入ってくる</text><text x="443.0" y="267.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >出ていく</text><rect x="12" y="291" width="536" height="71" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="332.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >胸膜腔内圧</text><text x="234.0" y="331.62" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >陰圧。吸うときさらに低い</text><text x="443.0" y="319.94" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >陰圧のまま</text><text x="443.0" y="343.94" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >（少しだけ戻る）</text><rect x="12" y="370" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="395" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >空気は圧の高い方から低い方へ流れる</text></svg>