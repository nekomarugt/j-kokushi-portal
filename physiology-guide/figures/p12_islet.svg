oke="#0b5ea8" stroke-width="1.5"/><text x="280" y="154" font-size="44" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >↓</text><text x="280" y="196" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >血糖を下げる</text><rect x="376" y="14" width="172" height="210" rx="12" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="462" y="48" font-size="22" fill="#2e8b57" font-weight="bold" text-anchor="middle" >D細胞</text><text x="462" y="84" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >ソマトスタチン</text><line x1="390" y1="100" x2="534" y2="100" stroke="#2e8b57" stroke-width="1.5"/><text x="462" y="154" font-size="44" fill="#2e8b57" font-weight="bold" text-anchor="middle" >−</text><text x="462" y="196" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >ほかを抑える</text><rect x="12" y="240" width="536" height="76" rx="12" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="270" font-size="19" fill="#142638" font-weight="bold" text-anchor="start" >血糖が上がる → B細胞がインスリンを出す</text><text x="28" y="300" font-size="19" fill="#142638" font-weight="bold" text-anchor="start" >血糖が下がる → A細胞がグルカゴンを出す</text></svg>