<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 366" width="560" height="366" role="img" aria-label="副腎皮質の3層と髄質のホルモンの表（塩・糖・性）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>副腎皮質の3層と髄質のホルモンの表（塩・糖・性）</title><rect width="560" height="366" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="12" width="536" height="40" rx="10" fill="#073b6a" stroke="#073b6a" stroke-width="2" /><text x="71.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >場所</text><text x="240.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >ホルモン</text><text x="449.0" y="38" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >ひとこと</text><rect x="12" y="58" width="536" height="69" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="86.48" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="middle" >球状層</text><text x="71.0" y="107.48" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="middle" >（いちばん外）</text><text x="240.0" y="97.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >アルドステロン</text><text x="449.0" y="97.94" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >塩（Na保持）</text><rect x="12" y="133" width="536" height="46" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="161.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >束状層</text><text x="240.0" y="161.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >コルチゾール</text><text x="449.0" y="161.12" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >糖（血糖維持・抗炎症）</text><rect x="12" y="185" width="536" height="46" rx="8" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="213.76" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >網状層</text><text x="240.0" y="213.44" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >アンドロゲン</text><text x="449.0" y="213.44" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >性</text><rect x="12" y="237" width="536" height="71" rx="8" fill="#fff" stroke="#d8e4ee" stroke-width="1.5" /><text x="71.0" y="278.26" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >髄質</text><text x="240.0" y="265.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >アドレナリン</text><text x="240.0" y="289.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >ノルアドレナリン</text><text x="449.0" y="277.94" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >急なストレスに対応</text><rect x="12" y="316" width="536" height="38" rx="8" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="28" y="341" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >外から「塩・糖・性」。コルチゾール過剰＝クッシング</text></svg>