<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1730" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script>if("serviceWorker"in navigator){addEventListener("load",function(){navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){})})}</script>
  <meta name="description" content="ポータルの学習資料と過去問から答えを探して見せる、解説AI（ブラウザ内で動く・無料）" />
  <title>解説AI｜柔道整復師 学習ポータル</title>
  <link rel="stylesheet" href="ai.css" />
  <script src="../backnav.js"></script>
</head>
<body>
  <header class="top">
    <a class="back" href="../" aria-label="学習ポータルへ戻る">←</a>
    <button id="chBtn" class="ch-btn" type="button" aria-label="先生を変える"><img id="chAv" class="top-av" src="chars/hinata-face.webp" alt="" />
    <span class="top-t"><span id="chName" class="top-name">解説AI</span><small>資料と過去問から探して答えるよ・タップで先生を変える</small></span></button>
    <button id="gear" class="gear" type="button" aria-label="設定">⚙️</button>
  </header>
  <section id="settings" class="settings" hidden>
    <button id="changeChar" class="change-char" type="button">先生を変える</button>
    <div class="set-row"><span>優先する科目</span>
      <div class="chips">
        <button class="subj-chip" data-subj="" type="button">すべて</button>
        <button class="subj-chip" data-subj="anatomy" type="button">解剖学</button>
        <button class="subj-chip" data-subj="physiology" type="button">生理学</button>
        <button class="subj-chip" data-subj="clinical" type="button">一般臨床</button>
      </div>
    </div>
    <label class="set-row"><span>AIモデル</span><select id="modelSel"></select></label>
    <label class="set-row chk"><input id="autoAi" type="checkbox" /> <span>毎回AIで説明する（準備できたあと）</span></label>
    <p id="gpuNote" class="set-note"></p>
    <p class="set-note">AIはスマホ・PCのブラウザの中だけで動くよ。質問は外に送られないし、お金もかからないよ。初回だけモデルをダウンロードするよ。</p>
  </section>
  <div id="prog" class="prog" hidden><div class="pbar-wrap"><div id="pbar" class="pbar"></div></div><small id="ptxt"></small></div>
  <section id="picker" class="picker" hidden></section>
  <main id="log" class="log" aria-live="polite"></main>
  <div id="sample" class="sample" aria-label="質問の例">
    <button type="button">上腕二頭筋の支配神経は？</button>
    <button type="button">活動電位の仕組みがわからない</button>
    <button type="button">左心不全と右心不全の違い</button>
  </div>
  <form id="askForm" class="ask">
    <textarea id="askInput" rows="1" placeholder="わからないことを聞いてね" aria-label="質問" maxlength="300"></textarea>
    <button id="send" type="submit" aria-label="送信">送信</button>
  </form>
  <script src="character.js"></script>
  <script src="search.js"></script>
  <script src="tutor-llm.js"></script>
  <script src="app.js"></script>
</body>
</html>
